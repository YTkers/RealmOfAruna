<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realm Of Aruna</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07101c;
    color:white;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* TOP UI */
#topUI{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.panel{
    background:rgba(4,12,30,.92);
    border:2px solid #56ddff;
    border-radius:14px;
    padding:7px 10px;
    text-shadow:0 2px 3px #000;
}

#title{
    color:#72edff;
    font-size:16px;
    font-weight:900;
}

.small{
    font-size:11px;
    margin-top:3px;
}

#hpbar{
    width:150px;
    height:11px;
    margin-top:4px;
    border:1px solid white;
    border-radius:10px;
    overflow:hidden;
    background:#421622;
}

#hpfill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#15df62,#e6ff55);
}

#weaponName{
    color:#ffe35b;
    font-size:11px;
    margin-top:3px;
}

/* MINI MAP */
#minimapBox{
    position:absolute;
    top:78px;
    right:9px;
    z-index:21;
    width:145px;
    height:145px;
    padding:5px;
    border:2px solid #59ddff;
    border-radius:13px;
    background:rgba(3,10,25,.88);

}

#minimap{
    width:100%;
    height:100%;
    display:block;
    border-radius:8px;
}

/* MESSAGE */
#message{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;

    padding:8px 13px;

#message.show{

}

#joystick{

    height:120px;
    z-index:30;
    border:3px solid #8cecff;
    border-radius:50%;
    background:rgba(55,110,155,.42);
}

#knob{
    position:absolute;
    left:50%;
    top:50%;
    width:56px;
    height:56px;

    border-radius:50%;
    background:#35caff;
    box-shadow:0 0 18px #19caff;
}

/* BUTTONS */
#buttons{
    position:absolute;
    right:9px;
    bottom:13px;
    z-index:30;
    display:flex;

}

button{

    border:2px solid white;
    -webkit-tap-highlight-color:transparent;
}

#attack{
    width:78px;
    height:78px;
    border-radius:50%;
    background:radial-gradient(circle,#ffe45c,#ff7a20,#d62222);
    box-shadow:0 5px 18px #000b;
}

.skills{
    display:flex;
    gap:5px;
}

.skill{
    position:relative;
    width:53px;
    height:53px;
    border-radius:12px;
    background:linear-gradient(#7d4cff,#24145e);
    font-size:21px;
}

.skill b{
    position:absolute;
    top:2px;
    left:4px;
    font-size:9px;
}

.skill .cooldown{
    position:absolute;
    right:2px;
    bottom:2px;
    left:2px;
    font-size:8px;
}

/* SHOP */
#shopToggle{
    position:absolute;
    top:230px;
    right:9px;
    z-index:25;
    padding:8px 11px;
    border-radius:10px;
    background:linear-gradient(#ffc936,#a94a00);
}

#shop{
    position:absolute;
    top:270px;
    right:9px;
    z-index:26;
    display:none;
    width:220px;
    max-height:55vh;
    overflow:auto;
    padding:10px;
    border:2px solid #ffd54d;
    border-radius:13px;
    background:rgba(5,15,35,.97);
}

.shopItem{
    width:100%;
    margin-top:5px;
    padding:8px;
    border:1px solid #6688aa;
    border-radius:8px;
    background:#253e68;
    color:white;
    font-size:10px;
}

/* BOSS BAR */
#bossBar{
    position:absolute;
    top:155px;
    left:50%;
    transform:translateX(-50%);
    width:min(360px,70%);
    display:none;
    z-index:40;
    text-align:center;
}

#bossName{
    font-weight:900;
    margin-bottom:3px;
    text-shadow:0 2px 3px #000;
}

#bossHP{
    height:13px;
    border:2px solid white;
    border-radius:10px;
    overflow:hidden;
    background:#350b12;
}

#bossFill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff2020,#ff9d00);
}

/* MOBILE */
@media(max-width:600px){
    #minimapBox{
        width:120px;
        height:120px;
        top:75px;
    }

    #shopToggle{
        top:205px;
    }

    #shop{
        top:245px;
        width:205px;
    }

    #joystick{
        width:112px;
        height:112px;
    }

    #knob{
        width:53px;
        height:53px;
    }

    #attack{
        width:73px;
        height:73px;
    }

    .skill{
        width:50px;
        height:50px;
    }
}
</style>
</head>

<canvas id="canvas"></canvas>

<div id="topUI">
    <div class="panel">

        <div class="small">❤️ <span id="hpText">100/100</span></div>

</div>

<div id="shop">
    <b>⚔ WEAPON SHOP</b>
    <div id="shopItems"></div>

    <hr>

    <b>✨ SKILL SHOP</b>

</div>

<div id="joystick">
    <div id="knob"></div>
</div>

    <div class="skills">
        <button class="skill" id="skill0"></button>
        <button class="skill" id="skill1"></button>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.max(1,Math.min(2,devicePixelRatio||1));

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   MAPS
========================================================= */

const MAPS=[
["Verdant Plains","#31864c","Slime","🟢"],
["Ember Valley","#873829","Fire Imp","👹"],
["Frostfall","#3d7398","Ice Wolf","🐺"],
["Storm Coast","#435f9e","Volt Bat","🦇"],
["Moonlit Woods","#3d4b73","Shadow Cat","🐈"],
["Crystal Caves","#6b4d98","Crystal Bug","🪲"],
["Sunken Ruins","#397b7e","Aqua Ghoul","🧟"],
["Ashen Fields","#604332","Ash Hound","🐕"],
["Sky Islands","#537fae","Wind Hawk","🦅"],
["Toxic Marsh","#54783a","Poison Frog","🐸"],
["Golden Desert","#a77c31","Sand Scarab","🪲"],
["Ancient Grove","#35653f","Treant","🌳"],
["Obsidian Pass","#4c414d","Rock Golem","🗿"],
["Starfall Valley","#505781","Astral Orb","🔮"],
["Haunted Keep","#342e51","Wraith","👻"],
["Dragonlands","#703331","Drake","🐲"],
["Infernal Gate","#792728","Demon","😈"],
["Celestial Fields","#657ba9","Seraph Guard","🪽"],
["Void Frontier","#302350","Voidling","👾"],
["Aruna Throne","#3a204d","Royal Guard","👑"]
];


/* =========================================================
   SKILLS
========================================================= */

const SKILLS=[
{name:"Fireball",icon:"🔥",damage:25,cooldown:4000,price:80},
{name:"Lightning",icon:"⚡",damage:34,cooldown:5200,price:120},
{name:"Ice Lance",icon:"❄️",damage:40,cooldown:6000,price:160},
{name:"Wind Blade",icon:"🌪️",damage:28,cooldown:4500,price:110},
{name:"Earth Spike",icon:"🪨",damage:47,cooldown:7000,price:200},
{name:"Water Burst",icon:"💧",damage:32,cooldown:5200,price:150},
{name:"Dark Bolt",icon:"🌑",damage:55,cooldown:7600,price:260},
{name:"Holy Ray",icon:"✨",damage:60,cooldown:8200,price:300},
{name:"Poison Nova",icon:"☠️",damage:38,cooldown:6500,price:180},
{name:"Meteor",icon:"☄️",damage:78,cooldown:10500,price:450},
{name:"Thunder Wave",icon:"🌩️",damage:50,cooldown:8000,price:280},
{name:"Frost Nova",icon:"🧊",damage:58,cooldown:8500,price:320},
{name:"Vine Lash",icon:"🌿",damage:42,cooldown:6200,price:210},
{name:"Arcane Orb",icon:"🔮",damage:65,cooldown:9000,price:380},
{name:"Flame Ring",icon:"🔥",damage:63,cooldown:8800,price:360},
{name:"Soul Drain",icon:"💜",damage:48,cooldown:7200,price:250},
{name:"Solar Spear",icon:"☀️",damage:72,cooldown:9800,price:420},
{name:"Moon Beam",icon:"🌙",damage:68,cooldown:9300,price:400},
{name:"Void Rift",icon:"🌀",damage:84,cooldown:11500,price:520},
{name:"Aruna Burst",icon:"💠",damage:100,cooldown:14000,price:700}
];


/* =========================================================
   WEAPONS
========================================================= */

const WEAPON_NAMES=[
"Wood Sword","Iron Sword","Steel Sword","Bronze Axe","War Axe",
"Twin Daggers","Long Bow","Crossbow","Spear","Halberd",
"Mace","Hammer","Katana","Greatsword","Flame Blade",
"Frost Blade","Thunder Staff","Wind Chakram","Shadow Scythe",
"Holy Staff","Crystal Blade","Poison Fang","Meteor Hammer",
"Dragon Slayer","Void Blade","Solar Spear","Moon Staff",
"Aruna Blade","Royal Sword","Legend Blade"
];

const WEAPONS=WEAPON_NAMES.map((name,i)=>({
    name:name,
    damage:8+i*4,
    price:50+i*75
}));


/* =========================================================
   GAME STATE
========================================================= */

let game=null;

function createGame(){

    return{

        running:true,

        map:0,

        gold:150,

        time:0,

        player:{
            x:0,
            y:0,
            hp:100,
            maxHp:100,
            speed:3.5,
            direction:"down",
            moving:false,
            attackCooldown:0,
            invincible:0,
            attackAnim:0
        },

        enemies:[],

        effects:[],

        floating:[],

        portal:null,

        miniBossDead:false,

        bossDead:false,

        skillSlots:[0,1,2],

        skillCooldown:[0,0,0],

        unlockedSkills:[0,1,2],

        weapon:0,

        messageTimer:null
    };
}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function initAudio(){

    try{

        if(!audioCtx){

            audioCtx=new(
                window.AudioContext||
                window.webkitAudioContext
            )();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

    }catch(e){}
}

function sound(type){

    if(!audioCtx)return;

    try{

        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();

        o.connect(g);
        g.connect(audioCtx.destination);

        let f=300;
        let duration=.1;
        let wave="sine";

        if(type==="attack"){
            f=140;
            wave="square";
            duration=.08;
        }

        if(type==="skill"){
            f=500;
            duration=.18;
        }

        if(type==="boss"){
            f=80;
            wave="sawtooth";
            duration=.45;
        }

        if(type==="portal"){
            f=700;
            duration=.4;
        }

        if(type==="buy"){
            f=850;
            duration=.1;
        }

        const now=audioCtx.currentTime;

        o.type=wave;

        o.frequency.setValueAtTime(f,now);

        o.frequency.exponentialRampToValueAtTime(
            Math.max(40,f*.35),
            now+duration
        );

        g.gain.setValueAtTime(.0001,now);

        g.gain.exponentialRampToValueAtTime(
            .14,
            now+.01
        );

        g.gain.exponentialRampToValueAtTime(
            .0001,
            now+duration
        );

        o.start(now);
        o.stop(now+duration+.02);

    }catch(e){}
}


/* =========================================================
   START GAME
   LANGSUNG JALAN — TIDAK ADA START BUTTON
========================================================= */

function startGame(){

    initAudio();

    game=createGame();

    document.getElementById("shop").style.display="none";

    spawnMap();

    updateUI();

    showMessage("⚔ MAP 1 DIMULAI!");

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    if(!game)return;

    const el=document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(game.messageTimer);

    game.messageTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}


/* =========================================================
   MAP SPAWN
========================================================= */

function spawnMap(){

    game.enemies=[];
    game.effects=[];
    game.floating=[];
    game.portal=null;

    game.miniBossDead=false;
    game.bossDead=false;

    game.player.x=0;
    game.player.y=0;

    game.player.hp=game.player.maxHp;

    /*
       MAP SEMAKIN TINGGI:
       jumlah musuh bertambah
    */

    const count=7+game.map*2;

    for(let i=0;i<count;i++){
        spawnEnemy("normal");
    }

    spawnEnemy("mini");
    spawnEnemy("boss");

    updateUI();
}


/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy(kind){

    const angle=Math.random()*Math.PI*2;

    /*
       Area spawn juga semakin luas
    */

    const radius=
        320+
        Math.random()*(
            400+game.map*25
        );

    /*
       BASE HP NAIK SETIAP MAP
    */

    let hp=
        35+
        game.map*18;

    /*
       DAMAGE MUSUH NAIK
    */

    let damage=
        4+
        game.map*1.2;

    /*
       SPEED NAIK SEDIKIT
    */

    let speed=
        .45+
        Math.random()*.25+
        game.map*.018;

    let size=1;

    if(kind==="mini"){

        hp*=4.5;
        damage*=2;
        speed*=.9;
        size=1.35;
    }

    if(kind==="boss"){

        hp*=10;
        damage*=3;
        speed*=.75;
        size=1.7;
    }

    game.enemies.push({

        x:Math.cos(angle)*radius,

        y:Math.sin(angle)*radius,

        hp:hp,

        maxHp:hp,

        damage:damage,

        speed:speed,

        kind:kind,

        size:size,

        hit:0
    });
}


/* =========================================================
   WORLD
========================================================= */

function worldToScreen(x,y){

    return{

        x:W/2+(x-game.player.x),

        y:H/2+(y-game.player.y)

    };
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle=MAPS[game.map][1];

    ctx.fillRect(0,0,W,H);

    /*
       GRID
    */

    ctx.globalAlpha=.12;

    ctx.strokeStyle="#fff";

    const grid=80;

    const ox=
        ((-game.player.x)%grid+grid)%grid;

    const oy=
        ((-game.player.y)%grid+grid)%grid;

    for(let x=ox;x<W;x+=grid){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();
    }

    for(let y=oy;y<H;y+=grid){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();
    }

    ctx.globalAlpha=1;

    /*
       DECORATION
    */

    for(let i=0;i<80;i++){

        const wx=
            ((i*197+game.map*91)%3000)-1500;

        const wy=
            ((i*137+game.map*51)%2200)-1100;

        const p=worldToScreen(wx,wy);

        if(
            p.x<-30||
            p.x>W+30||
            p.y<-30||
            p.y>H+30
        )continue;

        ctx.fillStyle="rgba(255,255,255,.13)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3+(i%5)*2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const p=worldToScreen(
        game.player.x,
        game.player.y
    );

    const walk=
        game.player.moving?
        Math.sin(game.time/70)*6:
        0;

    const dir=game.player.direction;

    ctx.save();

    ctx.translate(p.x,p.y);

    /*
       SHADOW
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        0,28,
        27,9,
        0,0,Math.PI*2
    );

    ctx.fill();

    /*
       LEGS
    */

    ctx.strokeStyle="#17243b";
    ctx.lineWidth=9;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(-8,10);
    ctx.lineTo(-10+walk,30);

    ctx.moveTo(8,10);
    ctx.lineTo(10-walk,30);

    ctx.stroke();

    /*
       BODY
    */

    ctx.fillStyle="#278ee9";
    ctx.strokeStyle="#d8f6ff";
    ctx.lineWidth=2;

    ctx.fillRect(-15,-14,30,29);

    ctx.strokeRect(-15,-14,30,29);

    /*
       ARMS
    */

    ctx.strokeStyle="#ffd0aa";
    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(-15,-7);
    ctx.lineTo(-28,-3-walk);

    ctx.moveTo(15,-7);
    ctx.lineTo(28,-3+walk);

    ctx.stroke();

    /*
       HEAD
    */

    ctx.fillStyle="#ffd0aa";

    ctx.beginPath();

    ctx.arc(0,-27,13,0,Math.PI*2);

    ctx.fill();

    /*
       HAIR
    */

    ctx.fillStyle="#39231b";

    ctx.beginPath();

    ctx.arc(
        0,-31,
        13,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
       EYES
    */

    ctx.fillStyle="#111";

    if(dir==="down"){

        ctx.fillRect(-7,-29,3,3);
        ctx.fillRect(5,-29,3,3);
    }

    if(dir==="right"){
        ctx.fillRect(7,-29,3,3);
    }

    if(dir==="left"){
        ctx.fillRect(-10,-29,3,3);
    }

    /*
       WEAPON
    */

    drawWeapon(dir);

    /*
       ATTACK EFFECT
    */

    if(game.player.attackAnim>0){

        ctx.strokeStyle="#fff5a0";

        ctx.lineWidth=5;

        ctx.shadowBlur=15;

        ctx.shadowColor="#fff";

        ctx.beginPath();

        if(dir==="right"){

            ctx.arc(
                25,0,
                32,
                -1,
                1
            );

        }else if(dir==="left"){

            ctx.arc(
                -25,0,
                32,
                2,
                4
            );

        }else if(dir==="up"){

            ctx.arc(
                0,-20,
                32,
                3.3,
                6
            );

        }else{

            ctx.arc(
                0,15,
                32,
                0,
                3
            );
        }

        ctx.stroke();

        ctx.shadowBlur=0;
    }

    ctx.restore();
}


/* =========================================================
   WEAPON DRAW
========================================================= */

function drawWeapon(dir){

    ctx.save();

    let angle=0;

    if(dir==="right")angle=0;
    if(dir==="down")angle=Math.PI/2;
    if(dir==="left")angle=Math.PI;
    if(dir==="up")angle=-Math.PI/2;

    ctx.translate(23,0)
