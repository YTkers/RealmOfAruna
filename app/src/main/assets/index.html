<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realm Of Aruna</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;font-family:Trebuchet MS,Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;background:#102238}
button{font:700 14px Trebuchet MS,Arial,sans-serif;color:#fff;border:1px solid #7ddcff;background:linear-gradient(#214a6e,#10283e);border-radius:10px;padding:9px 12px}
button:active{transform:scale(.95)}
#game{position:fixed;inset:0}
#hud{position:absolute;left:10px;top:10px;z-index:5;width:min(330px,70vw);pointer-events:none}
.bar{height:18px;background:#182231;border:2px solid #d8f4ff;border-radius:12px;overflow:hidden;margin-bottom:5px;box-shadow:0 0 8px #000}
.fill{height:100%;width:100%;transition:width .15s}
#hpFill{background:linear-gradient(90deg,#ff304f,#ff7b6b)}
#mpFill{background:linear-gradient(90deg,#298cff,#9cddff)}
#xpFill{background:linear-gradient(90deg,#b52dff,#f38cff)}
#stats{font-size:14px;text-shadow:2px 2px 3px #000;line-height:20px}
#mapName{font-size:18px;font-weight:900;color:#fff7a0;text-shadow:2px 2px 3px #000}
#bossUI{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(500px,72vw);display:none;text-align:center;z-index:5}
#bossName{font-size:18px;font-weight:900;color:#ffd66b;text-shadow:2px 2px 3px #000}
#bossBar{height:20px;background:#180c15;border:2px solid #ffd66b;border-radius:12px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff164f,#ff9c34)}
#skills{position:absolute;right:12px;bottom:16px;display:flex;gap:9px;z-index:7}
.skill{width:76px;height:76px;border-radius:16px;position:relative;text-align:center;padding:7px;overflow:hidden}
.skill .icon{font-size:30px;display:block}
.skill .name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill .cd{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;font-size:20px;color:#fff}
.skill.cooling .cd{display:flex}
#joystick{position:absolute;left:24px;bottom:25px;width:135px;height:135px;border-radius:50%;background:rgba(90,180,255,.14);border:2px solid rgba(180,230,255,.5);z-index:8}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(145,220,255,.55);border:2px solid #fff}
#attack{position:absolute;right:215px;bottom:28px;width:70px;height:70px;border-radius:50%;z-index:8;background:linear-gradient(#b94c54,#5c1726);border-color:#ffaaa8}
#interact{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:none;z-index:8}
#hint{position:absolute;left:50%;top:55px;transform:translateX(-50%);z-index:10;background:rgba(5,12,25,.86);border:1px solid #76dfff;border-radius:12px;padding:10px 18px;text-align:center;font-weight:900;color:#fff;display:none;text-shadow:1px 1px 2px #000}
#menu{position:absolute;right:10px;top:10px;z-index:10;display:flex;gap:6px}
#panel{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:85vh;overflow:auto;background:rgba(8,19,34,.97);border:2px solid #6bdcff;border-radius:18px;padding:16px;box-shadow:0 0 35px #000;display:none}
#panel h2{margin:0 0 12px;color:#fff38c;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.card{background:linear-gradient(135deg,#173553,#0d2034);border:1px solid #4b9cc5;border-radius:12px;padding:9px;min-height:100px}
.card b{display:block;color:#8fe9ff;margin-bottom:4px}
.card small{display:block;color:#fff;font-size:11px;line-height:16px}
.card button{margin-top:6px;width:100%;padding:6px;font-size:11px}
#close{width:100%;margin-top:12px}
#start{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at center,#183f63,#050b14 70%);display:flex;align-items:center;justify-content:center;text-align:center}
.startBox{width:min(600px,90vw)}
.startBox h1{font-size:clamp(42px,11vw,90px);margin:0;color:#ffe878;text-shadow:0 5px 0 #6b371c,0 0 25px #ff9d32}
.startBox p{font-size:17px;color:#d9f5ff}
#toast{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.82);border:1px solid #ffd85e;border-radius:10px;padding:9px 15px;display:none;color:#fff}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>

<div id="hud">
 <div id="mapName">Realm Of Aruna</div>
 <div class="bar"><div id="hpFill" class="fill"></div></div>
 <div class="bar"><div id="mpFill" class="fill"></div></div>
 <div class="bar"><div id="xpFill" class="fill"></div></div>
 <div id="stats">Lv 1 • HP 100/100 • Gold 100</div>
</div>

<div id="bossUI">
 <div id="bossName"></div>
 <div id="bossBar"><div id="bossFill"></div></div>
</div>

<div id="hint"></div>
<div id="toast"></div>

<div id="menu">
 <button onclick="openPanel('inventory')">🎒</button>
 <button onclick="openPanel('weapons')">⚔</button>
 <button onclick="openPanel('skills')">✨</button>
</div>

<div id="skills">
 <button class="skill" id="s0" onclick="cast(0)"><span class="icon">🔥</span><span class="name">Fireball</span><span class="cd">0</span></button>
 <button class="skill" id="s1" onclick="cast(1)"><span class="icon">⚡</span><span class="name">Lightning</span><span class="cd">0</span></button>
 <button class="skill" id="s2" onclick="cast(2)"><span class="icon">❄️</span><span class="name">Ice Shard</span><span class="cd">0</span></button>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="attack" onclick="attack()">⚔</button>
<button id="interact" onclick="interact()">ENTER PORTAL</button>

<div id="panel">
 <h2 id="panelTitle"></h2>
 <div id="panelContent"></div>
 <button id="close" onclick="closePanel()">CLOSE</button>
</div>

<div id="start">
 <div class="startBox">
  <h1>REALM<br>OF ARUNA</h1>
  <p>20 realms • 50 skills • 30 weapons • minibosses • bosses</p>
  <button onclick="startGame()" style="font-size:20px;padding:15px 35px">START ADVENTURE</button>
 </div>
</div>
</div>
