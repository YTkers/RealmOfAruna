<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Realm of Aruna</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10131a;
    color: #fff;
    font-family: system-ui, sans-serif;
    touch-action: none;
    user-select: none;
}

#game {
    display: block;
    width: 100%;
    height: 100%;
    background: #18251d;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.panel {
    position: absolute;
    background: rgba(10, 15, 22, .78);
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 12px;
    padding: 9px 11px;
    backdrop-filter: blur(5px);
}

#stats {
    left: 10px;
    top: 10px;
    min-width: 175px;
    font-size: 13px;
}

.bar {
    height: 8px;
    background: #343b45;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 4px;
}

.fill {
    height: 100%;
    width: 100%;
}

.hp {
    background: #e34b4b;
}

.xp {
    background: #5a9df5;
}

#quest {
    right: 10px;
    top: 10px;
    width: 190px;
    font-size: 12px;
}

#msg {
    left: 50%;
    top: 12%;
    transform: translateX(-50%);
    font-weight: 700;
    text-shadow: 0 2px 4px #000;
    white-space: nowrap;
}

#buttons {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    gap: 12px;
    align-items: end;
}

button {
    pointer-events: auto;
    border: 1px solid rgba(255, 255, 255, .2);
    color: #fff;
    background: rgba(20, 25, 35, .82);
    border-radius: 50%;
    width: 70px;
    height: 70px;
    font-weight: 800;
    font-size: 13px;
}

#attack {
    width: 84px;
    height: 84px;
    background: rgba(140, 48, 48, .9);
}

#bag {
    width: 58px;
    height: 58px;
}

#joy {
    position: absolute;
    left: 18px;
    bottom: 18px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .15);
    pointer-events: auto;
}

#knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 62px;
    height: 62px;
    margin: -31px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .25);
}

#inventory {
    display: none;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(330px, 88vw);
    pointer-events: auto;
}

#inventory.show {
    display: block;
}

.slot {
    display: inline-flex;
    width: 72px;
    height: 72px;
    margin: 5px;
    border: 1px solid #667080;
    border-radius: 10px;
    align-items: center;
    justify-content: center;
    background: #202936;
    font-size: 11px;
    text-align: center;
}

.small {
    opacity: .75;
    font-size: 11px;
}

.close {
    width: auto;
    height: auto;
    border-radius: 8px;
    padding: 8px 14px;
    margin-top: 8px;
}

@media (max-width: 500px) {
    #stats {
        min-width: 155px;
        font-size: 12px;
    }

    #quest {
        width: 165px;
    }

    #joy {
        width: 125px;
        height: 125px;
    }

    #knob {
        width: 56px;
        height: 56px;
        margin: -28px;
    }

    #buttons {
        right: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="stats" class="panel">
        <b>Aruna <span id="lvl">Lv. 1</span></b>

        <div>
            HP
            <span id="hpText">100/100</span>
        </div>

        <div class="bar">
            <div id="hp" class="fill hp"></div>
        </div>

        <div style="margin-top:5px;">
            EXP
            <span id="xpText">0/100</span>
        </div>

        <div class="bar">
            <div id="xp" class="fill xp"></div>
        </div>

        <div style="margin-top:6px;">
            💰 <span id="gold">50</span>
            &nbsp;
            ⚔️ <span id="atkText">15</span>
        </div>
    </div>

    <div id="quest" class="panel">
        <b>Quest: Slime Trouble</b>
        <br>
        Defeat 5 Slimes
        <br>
        <span id="questText">0 / 5</span>
    </div>

    <div id="msg"></div>

    <div id="joy">
        <div id="knob"></div>
    </div>

    <div id="buttons">
        <button id="bag">🎒<br>Bag</button>
        <button id="attack">⚔️<br>ATTACK</button>
    </div>

    <div id="inventory" class="panel">

        <h3 style="margin-top:0;">
            Inventory
        </h3>

        <div class="slot">
            🗡️<br>
            Rusty Sword
        </div>

        <div class="slot">
            🧪<br>
            Potion ×3
        </div>

        <div class="slot">
            🪙<br>
            Gold:
            <span id="gold2">50</span>
        </div>

        <br>

        <button id="closeBag" class="close">
            Tutup
        </button>

    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize() {

    dpr = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


/* =========================
   WORLD
========================= */

const world = {
    w: 2200,
    h: 1400
};


/* =========================
   PLAYER
========================= */

const p = {

    x: 1100,
    y: 700,

    r: 22,

    speed: 210,

    hp: 100,
    maxHp: 100,

    level: 1,
    xp: 0,

    gold: 50,
    atk: 15

};


/* =========================
   GAME STATE
========================= */

let slimes = [];
let kills = 0;

let cam = {
    x: 0,
    y: 0
};

let keys = {};

let joy = {
    x: 0,
    y: 0
};


/* =========================
   SLIMES
========================= */

function spawnSlime() {

    let attempts = 0;

    while (attempts < 100) {

        attempts++;

        const s = {

            x: 220 + Math.random() * 1760,
            y: 180 + Math.random() * 1040,

            r: 22,

            hp: 35,
            maxHp: 35,

            cd: 0,
            hit: 0

        };

        if (
            Math.hypot(
                s.x - p.x,
                s.y - p.y
            ) >= 280
        ) {

            slimes.push(s);
            return;

        }
    }
}


for (let i = 0; i < 12; i++) {
    spawnSlime();
}


/* =========================
   MESSAGE
========================= */

function say(text) {

    const m = document.getElementById("msg");

    m.textContent = text;

    clearTimeout(say.timer);

    say.timer = setTimeout(() => {
        m.textContent = "";
    }, 1800);
}


/* =========================
   SAVE
========================= */

function save() {

    try {

        localStorage.setItem(
            "arunaSave",
            JSON.stringify({

                p: {

                    level: p.level,
                    xp: p.xp,
                    gold: p.gold,
                    atk: p.atk,
                    maxHp: p.maxHp

                },

                kills: kills

            })
        );

    } catch (e) {

        console.log("Save error:", e);

    }
}


/* =========================
   LOAD
========================= */

function load() {

    try {

        const raw =
            localStorage.getItem("arunaSave");

        if (!raw) return;

        const s = JSON.parse(raw);

        if (s && s.p) {

            Object.assign(p, s.p);

            p.hp = p.maxHp;

        }

        kills = s.kills || 0;

    } catch (e) {

        console.log("Load error:", e);

    }
}

load();


/* =========================
   ATTACK
========================= */

function attack() {

    let target = null;
    let dist = Infinity;

    for (const s of slimes) {

        const d = Math.hypot(
            s.x - p.x,
            s.y - p.y
        );

        if (
            d < 95 &&
            d < dist
        ) {

            target = s;
            dist = d;

        }
    }

    if (!target) {

        say(
            "Tidak ada musuh dalam jarak serang"
        );

        return;
    }

    target.hp -= p.atk;
    target.hit = 0.12;

    if (target.hp <= 0) {

        slimes =
            slimes.filter(
                x => x !== target
            );

        kills++;

        p.gold += 8;

        gainXp(30);

        say(
            "+8 Gold • Slime defeated!"
        );

        if (kills % 5 === 0) {

            p.gold += 50;

            say(
                "Quest selesai! +50 Gold"
            );

        }

        spawnSlime();
        spawnSlime();

        save();
    }
}


/* =========================
   XP
========================= */

function gainXp(amount) {

    p.xp += amount;

    while (p.xp >= 100) {

        p.xp -= 100;

        p.level++;

        p.maxHp += 15;
        p.atk += 4;

        p.hp = p.maxHp;

        say(
            "LEVEL UP! Lv. " +
            p.level
        );
    }
}


/* =========================
   BUTTONS
========================= */

document
    .getElementById("attack")
    .addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();
            attack();

        }
    );


document
    .getElementById("bag")
    .addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            document
                .getElementById("inventory")
                .classList.add("show");

        }
    );


document
    .getElementById("closeBag")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById("inventory")
                .classList.remove("show");

        }
    );


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = true;

        if (
            e.key === " " ||
            e.key.toLowerCase() === "j"
        ) {

            e.preventDefault();
            attack();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================
   JOYSTICK
========================= */

const joyEl =
    document.getElementById("joy");

const knob =
    document.getElementById("knob");

let joyId = null;


function joyMove(e) {

    const r =
        joyEl.getBoundingClientRect();

    const centerX =
        r.left + r.width / 2;

    const centerY =
        r.top + r.height / 2;

    let dx =
        e.clientX - centerX;

    let dy =
        e.clientY - centerY;

    const max = 52;

    const len =
        Math.hypot(dx, dy);

    if (len > max) {

        dx =
            dx / len * max;

        dy =
            dy / len * max;

    }

    joy.x = dx / max;
    joy.y = dy / max;

    knob.style.transform =
        `translate(${dx}px, ${dy}px)`;
}


joyEl.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        joyId = e.pointerId;

        joyEl.setPointerCapture(
            joyId
        );

        joyMove(e);

    }
);


joyEl.addEventListener(
    "pointermove",
    function(e) {

        if (e.pointerId === joyId) {

            joyMove(e);

        }

    }
);


function resetJoy() {

    joyId = null;

    joy.x = 0;
    joy.y = 0;

    knob.style.transform =
        "translate(0,0)";
}


joyEl.addEventListener(
    "pointerup",
    resetJoy
);

joyEl.addEventListener(
    "pointercancel",
    resetJoy
);


/* =========================
   UPDATE
========================= */

function update(dt) {

    let x =
        (keys.d || keys.arrowright ? 1 : 0) -
        (keys.a || keys.arrowleft ? 1 : 0) +
        joy.x;

    let y =
        (keys.s || keys.arrowdown ? 1 : 0) -
        (keys.w || keys.arrowup ? 1 : 0) +
        joy.y;

    const len =
        Math.hypot(x, y);

    if (len > 1) {

        x /= len;
        y /= len;

    }


    p.x = Math.max(
        p.r,
        Math.min(
            world.w - p.r,
            p.x + x * p.speed * dt
        )
    );


    p.y = Math.max(
        p.r,
        Math.min(
            world.h - p.r,
            p.y + y * p.speed * dt
        )
    );


    /* SLIME AI */

    for (const s of slimes) {

        s.cd -= dt;

        s.hit =
            Math.max(
                0,
                s.hit - dt
            );

        const dx =
            p.x - s.x;

        const dy =
            p.y - s.y;

        const d =
            Math.hypot(dx, dy);


        if (
            d < 330 &&
            d > 48
        ) {

            s.x +=
                dx / d * 65 * dt;

            s.y +=
                dy / d * 65 * dt;

        }


        if (
            d < 52 &&
            s.cd <= 0
        ) {

            p.hp -= 7;

            s.cd = 1.1;


            if (p.hp <= 0) {

                p.hp = p.maxHp;

                p.x = 1100;
                p.y = 700;

                p.gold =
                    Math.max(
                        0,
                        p.gold - 10
                    );

                say(
                    "Kamu kalah! -10 Gold"
                );

            }
        }
    }


    /* CAMERA */

    cam.x =
        Math.max(
            0,
            Math.min(
                world.w - W,
                p.x - W / 2
            )
        );


    cam.y =
        Math.max(
            0,
            Math.min(
                world.h - H,
                p.y - H / 2
            )
        );


    updateUI();
}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("lvl")
        .textContent =
        "Lv. " + p.level;


    document.getElementById("hpText")
        .textContent =
        Math.max(
            0,
            Math.ceil(p.hp)
        ) +
        "/" +
        p.maxHp;


    document.getElementById("hp")
        .style.width =
        (
            p.hp /
            p.maxHp *
            100
        ) + "%";


    document.getElementById("xpText")
        .textContent =
        p.xp + "/100";


    document.getElementById("xp")
        .style.width =
        p.xp + "%";


    document.getElementById("gold")
        .textContent =
        p.gold;


    document.getElementById("gold2")
        .textContent =
        p.gold;


    document.getElementById("atkText")
        .textContent =
        p.atk;


    document.getElementById("questText")
        .textContent =
        Math.min(
            kills % 5,
            5
        ) +
        " / 5";
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.save();

    ctx.translate(
        -cam.x,
        -cam.y
    );


    /* GRASS */

    ctx.fillStyle =
        "#24442a";

    ctx.fillRect(
        0,
        0,
        world.w,
        world.h
    );


    /* TILE GRID */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    for (
        let x = 0;
        x < world.w;
        x += 48
    ) {

        for (
            let y = 0;
            y < world.h;
            y += 48
        ) {

            ctx.strokeRect(
                x,
                y,
                48,
                48
            );

        }
    }


    /* RIVER */

    ctx.fillStyle =
        "#315d86";

    ctx.fillRect(
        0,
        520,
        world.w,
        170
    );


    /* PATH */

    ctx.fillStyle =
        "#7d694c";

    ctx.fillRect(
        0,
        660,
        world.w,
        70
    );

    ctx.fillRect(
        1065,
        0,
        70,
        world.h
    );


    /* VILLAGE */

    ctx.fillStyle =
        "#6b5140";

    ctx.fillRect(
        960,
        600,
        280,
        210
    );


    ctx.fillStyle =
        "#c49a61";

    ctx.fillRect(
        1010,
        640,
        75,
        70
    );

    ctx.fillRect(
        1115,
        640,
        75,
        70
    );


    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 18px system-ui";

    ctx.fillText(
        "ARUNA VILLAGE",
        1000,
        830
    );


    /* TREES */

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const tx =
            (i * 317) % 2100 + 40;

        const ty =
            (i * 191) % 1250 + 40;


        if (
            Math.abs(tx - p.x) < 180 &&
            Math.abs(ty - p.y) < 180
        ) {

            continue;

        }


        ctx.fillStyle =
            "#17351e";

        ctx.beginPath();

        ctx.arc(
            tx,
            ty,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#72533a";

        ctx.fillRect(
            tx - 5,
            ty + 15,
            10,
            24
        );
    }


    /* SLIMES */

    for (const s of slimes) {

        ctx.save();

        ctx.translate(
            s.x,
            s.y
        );


        ctx.fillStyle =
            s.hit
                ? "#fff"
                : "#74d26e";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            s.r,
            Math.PI,
            0
        );


        ctx.lineTo(
            s.r,
            9
        );


        ctx.quadraticCurveTo(
            0,
            32,
            -s.r,
            9
        );


        ctx.closePath();

        ctx.fill();


        /* EYES */

        ctx.fillStyle =
            "#172018";

        ctx.beginPath();

        ctx.arc(
            -7,
            -2,
            3,
            0,
            Math.PI * 2
        );

        ctx.arc(
            7,
            -2,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* HP BAR */

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            -22,
            -35,
            44,
            5
        );


        ctx.fillStyle =
            "#e64d4d";

        ctx.fillRect(
            -22,
            -35,
            44 *
            Math.max(
                0,
                s.hp / s.maxHp
            ),
            5
        );


        ctx.restore();
    }


    /* PLAYER */

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    /* HEAD */

    ctx.fillStyle =
        "#d6a66a";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        p.r,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#3b6fd8";

    ctx.fillRect(
        -17,
        3,
        34,
        22
    );


    /* HAIR */

    ctx.fillStyle =
        "#5a3b25";

    ctx.fillRect(
        -13,
        -22,
        26,
        10
    );


    /* EYES */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        -9,
        -4,
        5,
        5
    );

    ctx.fillRect(
        4,
        -4,
        5,
        5
    );


    ctx.restore();


    /* NAME */

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 12px system-ui";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "Aruna",
        p.x,
        p.y - 32
    );


    ctx.restore();
}


/* =========================
   GAME LOOP
========================= */

let last =
    performance.now();


function loop(time) {

    const dt =
        Math.min(
            0.033,
            (time - last) / 1000
        );

    last = time;

    update(dt);

    draw();

    requestAnimationFrame(loop);
}


requestAnimationFrame(loop);


/* =========================
   INITIAL UI
========================= */

updateUI();

</script>

</body
