<style>
*{

}

html,body{

    width:100%;
    height:100%;
    overflow:hidden;

    color:white;
}

    inset:0;
    overflow:hidden;
    background:#101b29;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#topUI{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    justify-content:space-between;
    z-index:20;
    pointer-events:none;
}

.panel{
    background:rgba(3,10,24,.88);
    border:2px solid #55dfff;
    border-radius:12px;
    padding:8px 11px;
    text-shadow:0 2px 3px #000;
}

#title{
    color:#73eaff;
    font-weight:900;
    font-size:17px;
}

.small{
    font-size:12px;
    margin-top:3px;
}

#hpbar{
    width:160px;
    height:12px;
    margin-top:4px;
    border-radius:10px;
    background:#401722;
    border:1px solid white;
    overflow:hidden;
}

#hpfill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#18e768,#d7ff55);
}

#message{
    position:absolute;
    top:92px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    padding:9px 15px;
    border-radius:12px;
    border:2px solid #ffe05c;
    background:rgba(0,0,0,.88);

    text-align:center;

    transition:.2s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

#joystick{
    position:absolute;
    left:22px;
    bottom:22px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(65,105,145,.35);
    border:3px solid #8cecff;

}

#knob{

    width:58px;
    height:58px;

    top:50%;

}

#buttons{

}

button{

}

#attack{

    height:82px;

.skills{

}

    border-radius:13px;

.skill b{

========================================================= */

const canvas =

const ctx =
canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width =
        window.innerWidth * devicePixelRatio;

    H = canvas.height =
        window.innerHeight * devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================

const WEAPON_NAMES = [

const WEAPONS =

    (name,index)=>({

        8 + index * 4,

/* =========================================================
   GAME STATE
========================================================= */

let game = null;

function createGame(){

    return {

        running:true,

        map:0,

        gold:150,

        time:0,

        player:{

            x:0,
            y:0,

            hp:100,
            maxHp:100,

            speed:3.2,

            direction:"down",

            attackCooldown:0,

            invincible:0

        },

        enemies:[],

        effects:[],

        portal:null,

        miniBossDead:false,

        bossDead:false,

        skillSlots:[0,1,2],

        skillCooldown:[0,0,0],

        weapon:0,

        messageTimer:null

    };

}

/* =========================================================
   START / RESTART
========================================================= */

function startGame(){

    game = createGame();

    document.getElementById(
        "overlay"
    ).style.display="none";

    document.getElementById(
        "restart"
    ).style.display="none";

    spawnMap();

    showMessage(
        "⚔ Map 1 dimulai! Kalahkan miniboss dan boss."
    );

}

document.getElementById(
    "start"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "restart"
).addEventListener(
    "click",
    startGame
);

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const msg =
    document.getElementById(
        "message"
    );

    msg.textContent=text;

    msg.classList.add("show");

    clearTimeout(game.messageTimer);

    game.messageTimer =
    setTimeout(
        ()=>{
            msg.classList.remove("show");
        },
        2500
    );

}

/* =========================================================
   MAP
========================================================= */

function spawnMap(){

    game.enemies=[];

    game.effects=[];

    game.portal=null;

    game.miniBossDead=false;

    game.bossDead=false;

    game.player.x=0;
    game.player.y=0;

    /*
       NORMAL ENEMIES
    */

    const normalCount =
    7 + game.map % 5;

    for(
        let i=0;
        i<normalCount;
        i++
    ){

        spawnEnemy(
            "normal"
        );

    }

    /*
       MINIBOSS
    */

    spawnEnemy(
        "mini"
    );

    /*
       BOSS
    */

    spawnEnemy(
        "boss"
    );

    updateUI();

}

/* =========================================================
   ENEMY
========================================================= */

function spawnEnemy(kind){

    const angle =
    Math.random() *
    Math.PI *
    2;

    const radius =
    260 +
    Math.random() *
    500;

    const baseHp =
    35 +
    game.map * 12;

    let hp =
    baseHp;

    let speed =
    .65 +
    Math.random() *
    .3;

    let size=1;

    if(kind==="mini"){

        hp =
        baseHp * 4;

        speed=.55;

        size=1.3;

    }

    if(kind==="boss"){

        hp =
        baseHp * 8;

        speed=.4;

        size=1.7;

    }

    game.enemies.push({

        x:
        Math.cos(angle)*radius,

        y:
        Math.sin(angle)*radius,

        hp:hp,

        maxHp:hp,

        speed:speed,

        kind:kind,

        size:size,

        emoji:
        MAPS[game.map][3],

        name:
        MAPS[game.map][2],

        attackTimer:0

    });

}

/* =========================================================
   WORLD
========================================================= */

function worldToScreen(
    wx,
    wy
){

    return {

        x:
        W / (2*devicePixelRatio)
        +
        (wx-game.player.x),

        y:
        H / (2*devicePixelRatio)
        +
        (wy-game.player.y)

    };

}

/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    const width =
    W/devicePixelRatio;

    const height =
    H/devicePixelRatio;

    const color =
    MAPS[game.map][1];

    ctx.fillStyle=color;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    /*
       GRID
    */

    ctx.globalAlpha=.12;

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=1;

    const grid=80;

    const ox =
    ((-game.player.x)%grid+grid)%grid;

    const oy =
    ((-game.player.y)%grid+grid)%grid;

    for(
        let xx=ox;
        xx<width;
        xx+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(xx,0);

        ctx.lineTo(
            xx,
            height
        );

        ctx.stroke();

    }

    for(
        let yy=oy;
        yy<height;
        yy+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            yy
        );

        ctx.lineTo(
            width,
            yy
        );

        ctx.stroke();

    }

    ctx.globalAlpha=1;

    /*
       TERRAIN DECORATION
    */

    for(
        let i=0;
        i<45;
        i++
    ){

        const wx =
        ((i*197+
        game.map*93)%2200)-1100;

        const wy =
        ((i*137+
        game.map*51)%1500)-750;

        const p =
        worldToScreen(
            wx,
            wy
        );

        if(
            p.x<-30 ||
            p.x>width+30 ||
            p.y<-30 ||
            p.y>height+30
        ) continue;

        ctx.fillStyle=
        "rgba(255,255,255,.12)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            5+(i%4)*3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const p =
    worldToScreen(
        game.player.x,
        game.player.y
    );

    const bob =
    Math.sin(
        game.time/90
    )*2;

    ctx.save();

    ctx.translate(
        p.x,
        p.y+bob
    );

    /*
       SHADOW
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        0,
        28,
        25,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       LEGS
    */

    const step =
    Math.sin(
        game.time/90
    )*5;

    ctx.strokeStyle="#18233b";

    ctx.lineWidth=9;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -8,
        10
    );

    ctx.lineTo(
        -10+step,
        29
    );

    ctx.moveTo(
        8,
        10
    );

    ctx.lineTo(
        10-step,
        29
    );

    ctx.stroke();

    /*
       BODY
    */

    ctx.fillStyle="#279ff1";

    ctx.strokeStyle="#e0f8ff";

    ctx.lineWidth=2;

    ctx.fillRect(
        -15,
        -14,
        30,
        29
    );

    ctx.strokeRect(
        -15,
        -14,
        30,
        29
    );

    /*
       ARMS
    */

    const arm =
    Math.sin(
        game.time/90
    )*7;

    ctx.strokeStyle="#ffd0aa";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
        -15,
        -8
    );

    ctx.lineTo(
        -28,
        -2+arm
    );

    ctx.moveTo(
        15,
        -8
    );

    ctx.lineTo(
        28,
        -2-arm
    );

    ctx.stroke();

    /*
       HEAD
    */

    ctx.fillStyle="#ffd0aa";

    ctx.beginPath();

    ctx.arc(
        0,
        -27,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       HAIR
    */

    ctx.fillStyle="#342018";

    ctx.beginPath();

    ctx.arc(
        0,
        -32,
        13,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
       FACE DIRECTION
    */

    ctx.fillStyle="#111";

    if(
        game.player.direction==="right"
    ){

        ctx.fillRect(
            7,
            -29,
            3,
            3
        );

    }
    else if(
        game.player.direction==="left"
    ){

        ctx.fillRect(
            -10,
            -29,
            3,
            3
        );

    }
    else if(
        game.player.direction==="up"
    ){

        ctx.fillStyle="#342018";

        ctx.fillRect(
            -9,
            -39,
            18,
            5
        );

    }
    else{

        ctx.fillRect(
            -7,
            -30,
            3,
            3
        );

        ctx.fillRect(
            5,
            -30,
            3,
            3
        );

    }

    ctx.restore();

}

/* =========================================================
   ENEMY
========================================================= */

function drawEnemy(e){

    const p =
    worldToScreen(
        e.x,
        e.y
    );

    const width =
    W/devicePixelRatio;

    const height =
    H/devicePixelRatio;

    if(
        p.x<-100 ||
        p.x>width+100 ||
        p.y<-100 ||
        p.y>height+100
    ) return;

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.scale(
        e.size,
        e.size
    );

    /*
       SHADOW
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        0,
        28,
        28,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       DIFFERENT SHAPES
       DEPENDING ON MAP
    */

    const type =
    game.map % 6;

    if(type===0){

        ctx.fillStyle="#65d94a";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }
    else if(type===1){

        ctx.fillStyle="#df452d";

        ctx.beginPath();

        ctx.moveTo(
            0,-30
        );

        ctx.lineTo(
            -25,25
        );

        ctx.lineT
