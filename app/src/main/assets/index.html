<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realm Of Aruna</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07101c;
    color:white;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= TOP UI ================= */

#topUI{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.panel{
    background:rgba(3,10,25,.94);
    border:2px solid #56ddff;
    border-radius:16px;
    padding:10px 13px;
    text-shadow:0 2px 3px #000;
}

#title{
    color:#72edff;
    font-size:18px;
    font-weight:900;
}

.small{
    font-size:14px;
    margin-top:5px;
}

#hpbar{
    width:175px;
    height:14px;
    margin-top:6px;
    border:1px solid white;
    border-radius:10px;
    overflow:hidden;
    background:#451522;
}

#hpfill{
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        #15df62,
        #eaff55
    );
}

#weaponName{
    color:#ffe35b;
    font-size:14px;
    margin-top:5px;
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    max-width:90%;
    padding:10px 15px;
    border:2px solid #ffe15a;
    border-radius:12px;
    background:rgba(0,0,0,.9);
    text-align:center;
    font-weight:bold;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

/* ================= MINI MAP ================= */

#miniMap{
    position:absolute;
    top:84px;
    right:12px;
    width:145px;
    height:100px;
    z-index:22;
    border:2px solid #72eaff;
    border-radius:12px;
    background:rgba(0,10,25,.92);
    overflow:hidden;
}

#miniCanvas{
    width:100%;
    height:100%;
}

/* ================= SHOP ================= */

#shopToggle{
    position:absolute;
    top:200px;
    right:12px;
    z-index:25;
    padding:10px 14px;
    border-radius:12px;
    background:linear-gradient(#ffc936,#a94a00);
    color:white;
    font-weight:900;
    border:2px solid white;
}

#shop{
    position:absolute;
    top:250px;
    right:12px;
    width:230px;
    max-height:55vh;
    overflow:auto;
    z-index:26;
    display:none;
    padding:12px;
    border:2px solid #ffd54d;
    border-radius:13px;
    background:rgba(5,15,35,.97);
}

.shopItem{
    width:100%;
    margin-top:6px;
    padding:9px;
    border:0;
    border-radius:8px;

    color:white;
    font-size:12px;

}

.shopItem:active{

}

/* ================= BOSS ================= */

#bossBar{
    position:absolute;
    left:50%;
    bottom:115px;
    transform:translateX(-50%);
    width:min(420px,70%);
    z-index:21;
    display:none;
    text-align:center;
}

#bossName{
    font-weight:900;

}

#bossHp{
    height:13px;
    border:2px solid white;
    border-radius:10px;
    overflow:hidden;
    background:#321015;
}

#bossFill{
    width:100%;
    height:100%;
    background:#e83245;
}

/* ================= JOYSTICK ================= */

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:125px;
    height:125px;
    z-index:30;
    border:3px solid #8cecff;
    border-radius:50%;
    background:rgba(55,110,155,.4);
    box-shadow:0 0 20px #19caff55;
}

#knob{
    position:absolute;
    left:50%;
    top:50%;
    width:56px;
    height:56px;
    transform:translate(-50%,-50%);
    border:3px solid white;
    border-radius:50%;
    background:#35caff;
    box-shadow:0 0 18px #19caff;
}

/* ================= BUTTONS ================= */

#buttons{
    position:absolute;
    right:12px;
    bottom:20px;
    z-index:30;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

button{

    font-family:Arial,sans-serif;
    font-weight:900;
    border:2px solid white;
    -webkit-tap-highlight-color:transparent;
}

#attack{

    height:82px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #ffe45c,
        #ff7a20,
        #d62222
    );

}

#attack:active{
    transform:scale(.92);
}

.skills{
    display:flex;
    gap:6px;
}

.skill{
    position:relative;
    width:57px;
    height:57px;
    border-radius:12px;
    background:linear-gradient(#7d4cff,#24145e);
    font-size:23px;
}

.skill:active{
    transform:scale(.92);
}

.skill b{
    position:absolute;
    top:3px;
    left:5px;
    font-size:9px;
}

.skill span{
    position:absolute;
    bottom:3px;
    left:2px;
    right:2px;
    font-size:9px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    #title{

    }

    #joystick{

        bottom:18px;
    }

    #knob{
        width:52px;
        height:52px;
    }

    .skill{
        width:50px;
        height:50px;
    }

    #attack{
        width:72px;
        height:72px;
        font-size:12px;
    }

    #buttons{
        right:10px;
        bottom:14px;
        gap:5px;
    }

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const miniCanvas = document.getElementById("miniCanvas");
const miniCtx = miniCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const d = Math.max(
        1,
        Math.min(2, devicePixelRatio || 1)
    );

    canvas.width = W * d;
    canvas.height = H * d;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(d,0,0,d,0,0);

    miniCanvas.width = 290;
    miniCanvas.height = 200;
}

addEventListener("resize", resize);

resize();


/* =====================================================
   MAPS
===================================================== */

const MAPS = [

    ["Verdant Plains","#31864c","Slime","🟢"],
    ["Ember Valley","#873829","Fire Imp","👹"],
    ["Frostfall","#3d7398","Ice Wolf","🐺"],
    ["Storm Coast","#435f9e","Volt Bat","🦇"],
    ["Moonlit Woods","#3d4b73","Shadow Cat","🐈"],
    ["Crystal Caves","#6b4d98","Crystal Bug","🪲"],
    ["Sunken Ruins","#397b7e","Aqua Ghoul","🧟"],
    ["Ashen Fields","#604332","Ash Hound","🐕"],
    ["Sky Islands","#537fae","Wind Hawk","🦅"],
    ["Toxic Marsh","#54783a","Poison Frog","🐸"],
    ["Golden Desert","#a77c31","Sand Scarab","🪲"],
    ["Ancient Grove","#35653f","Treant","🌳"],
    ["Obsidian Pass","#4c414d","Rock Golem","🗿"],
    ["Starfall Valley","#505781","Astral Orb","🔮"],
    ["Haunted Keep","#342e51","Wraith","👻"],
    ["Dragonlands","#703331","Drake","🐲"],
    ["Infernal Gate","#792728","Demon","😈"],
    ["Celestial Fields","#657ba9","Seraph Guard","🪽"],
    ["Void Frontier","#302350","Voidling","👾"],
    ["Aruna Throne","#3a204d","Royal Guard","👑"]

];


/* =====================================================
   SKILLS
===================================================== */

const SKILLS = [

    {name:"Fireball",icon:"🔥",damage:25,cooldown:4000},
    {name:"Lightning",icon:"⚡",damage:34,cooldown:5200},
    {name:"Ice Lance",icon:"❄️",damage:40,cooldown:6000},
    {name:"Wind Blade",icon:"🌪️",damage:28,cooldown:4500},
    {name:"Earth Spike",icon:"🪨",damage:47,cooldown:7000},
    {name:"Water Burst",icon:"💧",damage:32,cooldown:5200},
    {name:"Dark Bolt",icon:"🌑",damage:55,cooldown:7600},
    {name:"Holy Ray",icon:"✨",damage:60,cooldown:8200},
    {name:"Poison Nova",icon:"☠️",damage:38,cooldown:6500},
    {name:"Meteor",icon:"☄️",damage:78,cooldown:10500},
    {name:"Thunder Wave",icon:"🌩️",damage:50,cooldown:8000},
    {name:"Frost Nova",icon:"🧊",damage:58,cooldown:8500},
    {name:"Vine Lash",icon:"🌿",damage:42,cooldown:6200},
    {name:"Arcane Orb",icon:"🔮",damage:65,cooldown:9000},
    {name:"Flame Ring",icon:"🔥",damage:63,cooldown:8800},
    {name:"Soul Drain",icon:"💜",damage:48,cooldown:7200},
    {name:"Solar Spear",icon:"☀️",damage:72,cooldown:9800},
    {name:"Moon Beam",icon:"🌙",damage:68,cooldown:9300},
    {name:"Void Rift",icon:"🌀",damage:84,cooldown:11500},
    {name:"Aruna Burst",icon:"💠",damage:100,cooldown:14000}

];


/* =====================================================
   WEAPONS
===================================================== */

const WEAPON_NAMES = [

    "Wood Sword",
    "Iron Sword",
    "Steel Sword",
    "Bronze Axe",
    "War Axe",
    "Twin Daggers",
    "Long Bow",
    "Crossbow",
    "Spear",
    "Halberd",
    "Mace",
    "Hammer",
    "Katana",
    "Greatsword",
    "Flame Blade",
    "Frost Blade",
    "Thunder Staff",
    "Wind Chakram",
    "Shadow Scythe",
    "Holy Staff",
    "Crystal Blade",
    "Poison Fang",
    "Meteor Hammer",
    "Dragon Slayer",
    "Void Blade",
    "Solar Spear",
    "Moon Staff",
    "Aruna Blade",
    "Royal Sword",
    "Legend Blade"

];

const WEAPONS = WEAPON_NAMES.map((name,i)=>({

    name:name,

    damage:8 + i * 5,

    price:50 + i * 75

}));


/* =====================================================
   GAME STATE
===================================================== */

let game = {

    map:0,

    gold:150,

    time:0,

    player:{

        x:0,
        y:0,

        hp:100,
        maxHp:100,

        speed:3.5,

        direction:"down",

        attackCooldown:0,

        attackAnim:0,

        invincible:0

    },

    enemies:[],

    effects:[],

    floating:[],

    portal:null,

    skillCooldown:[0,0,0],

    weapon:0,

    unlockedSkills:[0,1,2],

    over:false

};


/* =====================================================
   JOYSTICK
===================================================== */

let joy = {

    active:false,

    x:0,

    y:0

};

const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");


function joystickMove(e){

    const r = joystick.getBoundingClientRect();

    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    let dx = e.clientX - cx;
    let dy = e.clientY - cy;

    const max = r.width * .38;

    const len = Math.hypot(dx,dy);

    if(len > max){

        dx = dx / len * max;
        dy = dy / len * max;

    }

    joy.x = dx / max;
    joy.y = dy / max;

    knob.style.left =
        `calc(50% + ${dx}px)`;

    knob.style.top =
        `calc(50% + ${dy}px)`;

}


function joystickEnd(){

    joy.active = false;

    joy.x = 0;
    joy.y = 0;

    knob.style.left = "50%";
    knob.style.top = "50%";

}


joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joy.active = true;

    joystickMove(e);

});


addEventListener("pointermove",e=>{

    if(joy.active){

        joystickMove(e);

    }

});


addEventListener("pointerup",joystickEnd);
addEventListener("pointercancel",joystickEnd);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(text){

    const el = document.getElementById("message");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer = setTimeout(()=>{

        el.classList.remove("show");

    },1800);

}


/* =====================================================
   SPAWN MAP
===================================================== */

function spawnMap(){

    game.enemies = [];

    game.effects = [];

    game.floating = [];

    game.portal = null;

    game.over = false;

    game.player.x = 0;
    game.player.y = 0;

    game.player.hp = game.player.maxHp;

    game.player.invincible = 0;

    const count =
        6 +
        game.map * 2 +
        Math.floor(game.map / 3);

    for(let i=0;i<count;i++){

        spawnEnemy("normal");

    }

    spawnEnemy("mini");

    spawnEnemy("boss");

    updateUI();

    showMessage(
        "🗺️ MAP " +
        (game.map + 1) +
        " — " +
        MAPS[game.map][0]
    );

}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy(type){

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        280 +
        Math.random() * 600;

    let hp =
        35 +
        game.map * 22;

    let speed =
        .45 +
        Math.random() * .25 +
        game.map * .015;

    let size = 1;

    if(type === "mini"){

        hp *= 4 + game.map * .15;

        speed =
            .55 +
            game.map * .01;

        size = 1.4;

    }

    if(type === "boss"){

        hp *= 9 + game.map * .5;

        speed =
            .32 +
            game.map * .008;

        size = 1.8;

    }

    game.enemies.push({

        x:Math.cos(angle) * distance,

        y:Math.sin(angle) * distance,

        hp:hp,

        maxHp:hp,

        speed:speed,

        type:type,

        size:size,

        hit:0

    });

}


/* =====================================================
   WORLD TO SCREEN
===================================================== */

function worldToScreen(x,y){

    return {

        x:W / 2 + (x - game.player.x),

        y:H / 2 + (y - game.player.y)

    };

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

    const map = MAPS[game.map];

    ctx.fillStyle = map[1];

    ctx.fillRect(0,0,W,H);


    /* GRID */

    ctx.globalAlpha = .12;

    ctx.strokeStyle = "#fff";

    const grid = 80;

    const ox =
        ((-game.player.x) % grid + grid) % grid;

    const oy =
        ((-game.player.y) % grid + grid) % grid;


    for(let x=ox;x<W;x+=grid){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(let y=oy;y<H;y+=grid){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }

    ctx.globalAlpha = 1;


    /* DECORATION */

    for(let i=0;i<80;i++){

        const wx =
            ((i*197 + game.map*91) % 2800) - 1400;

        const wy =
            ((i*137 + game.map*51) % 2000) - 1000;

        const p = worldToScreen(wx,wy);

        if(
            p.x < -30 ||
            p.x > W + 30 ||
            p.y < -30 ||
            p.y > H + 30
        ) continue;

        ctx.fillStyle =
            i % 3 === 0
            ? "rgba(255,255,255,.18)"
            : "rgba(0,0,0,.15)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3 + i % 5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    const p = worldToScreen(
        game.player.x,
        game.player.y
    );

    const moving =
        Math.abs(joy.x) +
        Math.abs(joy.y) > .1;

    const walk =
        moving
        ? Math.sin(game.time / 70) * 5
        : 0;


    ctx.save();

    ctx.translate(p.x,p.y);


    /* SHADOW */

    ctx.fillStyle = "#0008";

    ctx.beginPath();

    ctx.ellipse(
        0,
        29,
        27,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* LEGS */

    ctx.strokeStyle = "#16243c";
    ctx.lineWidth = 9;
    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(-8,9);
    ctx.lineTo(-10 + walk,30);

    ctx.moveTo(8,9);
    ctx.lineTo(10 - walk,30);

    ctx.stroke();


    /* BODY */

    ctx.fillStyle = "#278ee9";
    ctx.strokeStyle = "#d8f6ff";
    ctx.lineWidth = 2;

    ctx.fillRect(
        -15,
        -14,
        30,
        29
    );

    ctx.strokeRect(
        -15,
        -14,
        30,
        29
    );


    /* ARMS */

    ctx.strokeStyle = "#ffd0aa";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(-15,-7);
    ctx.lineTo(-28,-3);

    ctx.moveTo(15,-7);
    ctx.lineTo(28,-3);

    ctx.stroke();


    /* HEAD */

    ctx.fillStyle = "#ffd0aa";

    ctx.beginPath();

    ctx.arc(
        0,
        -27,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* HAIR */

    ctx.fillStyle = "#39231b";

    ctx.beginPath();

    ctx.arc(
        0,
        -31,
        13,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* EYES */

    ctx.fillStyle = "#111";

    if(game.player.direction === "down"){

        ctx.fillRect(-7,-29,3,3);
        ctx.fillRect(5,-29,3,3);

    }

    if(game.player.direction === "right"){

        ctx.fillRect(7,-29,3,3);

    }

    if(game.player.direction === "left"){

        ctx.fillRect(-10,-29,3,3);

    }


    drawWeapon();


    /* ATTACK EFFECT */

    if(game.player.attackAnim > 0){

        ctx.strokeStyle = "#fff5a0";

        ctx.lineWidth = 5;

        ctx.shadowBlur = 15;

        ctx.shadowColor = "#fff";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            45,
            -1.2,
            1.2
        );

        ctx.stroke();

        ctx.shadowBlur = 0;

    }


    ctx.restore();

}


/* =====================================================
   WEAPON
===================================================== */

function drawWeapon(){

    ctx.save();

    let angle = 0;

    if(game.pla
