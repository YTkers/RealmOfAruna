/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function audioInit(){
    if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    }
}

function beep(type){
    audioInit();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    const frequencies={
        sword:180,
        fire:220,
        ice:700,
        lightning:1000,
        water:420,
        wind:550,
        earth:120,
        shadow:160,
        light:850,
        arcane:500,
        poison:260,
        portal:1100,
        boss:70,
        pickup:800
    };

    osc.frequency.value=frequencies[type]||350;
    osc.type=type==="arcane"?"sine":"square";

    gain.gain.setValueAtTime(.10,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.2
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.22);
}

/* =========================================================
   PLAYER
========================================================= */

const player={

    vy:0,

    hp:100,
    maxHp:100,
    level:1,
    xp:0,
    weapon:WEAPONS[0],
    skills:[SKILLS[0],SKILLS[5],SKILLS[10]],
    cooldown:[0,0,0],
    attackCD:0,
    attackAnim:0
};

/* =========================================================
   WORLD
========================================================= */

const WORLD=5200;

let mapIndex=0;
let enemies=[];
let particles=[];
let portal=null;
let miniDead=false;
let bossDead=false;

/* =========================================================
   ENEMY SPAWN
========================================================= */

function createEnemy(type,x,y,kind="normal"){

    let hp=50+mapIndex*12;

    if(kind==="mini")
        hp=450+mapIndex*80;

    if(kind==="boss")
        hp=1200+mapIndex*180;

    enemies.push({
        type,
        kind,
        x,
        y,
        vx:0,
        vy:0,
        hp,
        maxHp:hp,
        radius:
            kind==="boss"?65:
            kind==="mini"?42:
            23,
        attackTimer:0,
        phase:Math.random()*10
    });
}

function startMap(){

    enemies=[];
    particles=[];
    portal=null;
    miniDead=false;
    bossDead=false;

    player.x=0;
    player.y=0;
    player.hp=player.maxHp;

    const type=ENEMY_TYPES[mapIndex];

    for(let i=0;i<18+mapIndex;i++){

        createEnemy(
            type,
            (Math.random()-.5)*WORLD,
            (Math.random()-.5)*WORLD
        );
    }

    createEnemy(
        type,
        -900,
        -500,
        "mini"
    );

    createEnemy(
        type,
        1100,
        900,
        "boss"
    );

    updateMapUI();
}

/* =========================================================
   MAP UI
========================================================= */

function updateMapUI(){

    document.getElementById("mapName").textContent=
        "MAP "+(mapIndex+1)+
        " — "+
        MAPS[mapIndex][0];

    document.body.style.background=
        MAPS[mapIndex][1];
}

/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,color,size=5,life=.5){

    particles.push({
        x,
        y,
        vx:(Math.random()-.5)*180,
        vy:(Math.random()-.5)*180,
        size,
        color,
        life,
        max:life
    });
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.98;
        p.vy*=.98;

        p.life-=dt;

        if(p.life<=0)
            particles.splice(i,1);
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=p.life/p.max;

        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   ENEMY DRAWING
========================================================= */

function drawEnemy(e){

    ctx.save();
    ctx.translate(e.x,e.y);

    const scale=
        e.kind==="boss"?1.7:
        e.kind==="mini"?1.35:
        1;

    ctx.scale(scale,scale);

    const type=e.type;

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(
        0,
        24,
        28,
        9,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    /* slime */

    if(type==="slime"){
        ctx.fillStyle="#43d85c";
        ctx.beginPath();
        ctx.arc(0,5,25,Math.PI,0);
        ctx.lineTo(25,17);
        ctx.quadraticCurveTo(
            0,35,
            -25,17
        );
        ctx.closePath();
        ctx.fill();
        enemyEyes();
    }

    /* bat */

    else if(type==="bat"){
        ctx.fillStyle="#713ca5";

        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(-42,-22);
        ctx.lineTo(-29,20);
        ctx.lineTo(0,7);
        ctx.lineTo(29,20);
        ctx.lineTo(42,-22);
        ctx.closePath();
        ctx.fill();

        enemyEyes();
    }

    /* wolf */

    else if(type==="wolf"){

        ctx.fillStyle="#9097a0";

        ctx.beginPath();
        ctx.ellipse(
            0,7,30,18,
            0,0,Math.PI*2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(20,-5);
        ctx.lineTo(40,-24);
        ctx.lineTo(34,5);
        ctx.fill();

        enemyEyes();
    }

    /* scorpion */

    else if(type==="scorpion"){

        ctx.strokeStyle="#c27a31";
        ctx.lineWidth=9;

        ctx.beginPath();
        ctx.arc(
            0,
            5,
            22,
            0,
            Math.PI*2
        );
        ctx.stroke();

        ctx.lineWidth=5;

        for(let i=0;i<4;i++){

            ctx.beginPath();

            ctx.moveTo(-15,5);
            ctx.lineTo(
                -48,
                -22+i*18
            );

            ctx.moveTo(15,5);
            ctx.lineTo(
                48,
                -22+i*18
            );

            ctx.stroke();
        }
    }

    /* zombie */

    else if(type==="zombie"){

        ctx.fillStyle="#6e8d6a";
        ctx.fillRect(
            -20,-4,40,42
        );

        ctx.fillStyle="#a4b794";

        ctx.beginPath();
        ctx.arc(
            0,
            -25,
            18,
            0,
            Math.PI*2
        );
        ctx.fill();

        enemyEyes();
    }

    /* golem */

    else if(type==="golem"){

        ctx.fillStyle="#777b83";

        ctx.beginPath();
        ctx.moveTo(-30,-28);
        ctx.lineTo(30,-28);
        ctx.lineTo(38,30);
        ctx.lineTo(-38,30);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle="#aaa";
        ctx.lineWidth=3;
        ctx.stroke();

        enemyEyes();
    }

    /* treant */

    else if(type==="treant"){

        ctx.fillStyle="#704627";
        ctx.fillRect(
            -16,-2,32,40
        );

        ctx.fillStyle="#2d8c43";

        ctx.beginPath();
        ctx.arc(
            0,-27,
            32,
            0,
            Math.PI*2
        );
        ctx.fill();

        enemyEyes();
    }

    /* ghost */

    else if(type==="ghost"){

        ctx.globalAlpha=.7;
        ctx.fillStyle="#d9efff";

        ctx.beginPath();
        ctx.arc(
            0,-7,
            25,
            Math.PI,
            0
        );

        ctx.lineTo(25,30);
        ctx.lineTo(10,18);
        ctx.lineTo(0,30);
        ctx.lineTo(-10,18);
        ctx.lineTo(-25,30);

        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha=1;

        enemyEyes();
    }

    /* serpent */

    else if(type==="serpent"){

        ctx.strokeStyle="#38ad5b";
        ctx.lineWidth=14;

        ctx.beginPath();

        for(let i=0;i<80;i++){

            const xx=-40+i;
            const yy=
                Math.sin(i*.17+
                performance.now()/300)*10;

            if(i===0)
                ctx.moveTo(xx,yy);
            else
                ctx.lineTo(xx,yy);
        }

        ctx.stroke();

        enemyEyes();
    }

    /* dragon */

    else if(type==="dragon"){

        ctx.fillStyle="#a82b32";

        ctx.beginPath();
        ctx.ellipse(
            0,5,
            35,22,
            0,0,Math.PI*2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-20,-5);
        ctx.lineTo(-70,-40);
        ctx.lineTo(-45,13);

        ctx.moveTo(20,-5);
        ctx.lineTo(70,-40);
        ctx.lineTo(45,13);

        ctx.fill();

        enemyEyes();
    }

    /* demon */

    else if(type==="demon"){

        ctx.fillStyle="#a52a35";
        ctx.fillRect(
            -24,-4,
            48,45
        );

        ctx.beginPath();
        ctx.arc(
            0,-25,
            23,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.beginPath()
