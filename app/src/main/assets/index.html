<style>

html,body{

#attack{

#attack:active{

}

.skills{

.skill:active{

}

.skill b{
    position:absolute;

}

.cooldown{

#weaponInfo{

}

#shopToggle,

    padding:8px;

    font-size:11px;
}

#shopToggle{
    top:120px;
}

#skillBookToggle{
    top:164px;
    background:linear-gradient(#a25cff,#4420a5);
}

#shop,
#skillBook{
    position:absolute;

    width:245px;

    z-index:45;
    display:none;

    border:2px solid #ffd54d;

}

#skillBook{

}

.shopItem,

    text-align:left;

}

#overlay{

#menu{

.menuBtn{

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.max(1,Math.min(2,devicePixelRatio||1));

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.max(1,Math.min(2,devicePixelRatio||1));

    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function initAudio(){
    try{
        if(!audioCtx){
            audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }
    }catch(e){}
}

function sound(type){
    if(!audioCtx) return;

    try{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now=audioCtx.currentTime;

        let f1=300;
        let f2=100;
        let duration=.12;

        if(type==="attack"){
            f1=180;
            f2=80;
            duration=.1;
        }

        if(type==="fire"){
            f1=160;
            f2=700;
            duration=.2;
        }

        if(type==="lightning"){
            f1=800;
            f2=130;
            duration=.18;
        }

        if(type==="ice"){
            f1=900;
            f2=500;
            duration=.22;
        }

        if(type==="magic"){
            f1=420;
            f2=850;
            duration=.2;
        }

        if(type==="hit"){
            f1=120;
            f2=60;
            duration=.09;
        }

        if(type==="boss"){
            f1=80;
            f2=40;
            duration=.45;
        }

        if(type==="buy"){
            f1=500;
            f2=900;
            duration=.16;
        }

        osc.type=type==="lightning"?"square":"sine";

        osc.frequency.setValueAtTime(f1,now);
        osc.frequency.exponentialRampToValueAtTime(
            Math.max(30,f2),
            now+duration
        );

        gain.gain.setValueAtTime(.0001,now);
        gain.gain.exponentialRampToValueAtTime(.12,now+.015);
        gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

        osc.start(now);
        osc.stop(now+duration+.02);
    }catch(e){}
}

/* =========================================================
   MAPS
========================================================= */

const MAPS=[
["Verdant Plains","#31864c","Slime","🟢"],
["Ember Valley","#873829","Fire Imp","👹"],
["Frostfall","#3d7398","Ice Wolf","🐺"],
["Storm Coast","#435f9e","Volt Bat","🦇"],
["Moonlit Woods","#3d4b73","Shadow Cat","🐈"],
["Crystal Caves","#6b4d98","Crystal Bug","🪲"],
["Sunken Ruins","#397b7e","Aqua Ghoul","🧟"],
["Ashen Fields","#604332","Ash Hound","🐕"],
["Sky Islands","#537fae","Wind Hawk","🦅"],
["Toxic Marsh","#54783a","Poison Frog","🐸"],
["Golden Desert","#a77c31","Sand Scarab","🪲"],
["Ancient Grove","#35653f","Treant","🌳"],
["Obsidian Pass","#4c414d","Rock Golem","🗿"],
["Starfall Valley","#505781","Astral Orb","🔮"],
["Haunted Keep","#342e51","Wraith","👻"],
["Dragonlands","#703331","Drake","🐲"],
["Infernal Gate","#792728","Demon","😈"],
["Celestial Fields","#657ba9","Seraph Guard","🪽"],
["Void Frontier","#302350","Voidling","👾"],
["Aruna Throne","#3a204d","Royal Guard","👑"]
];

/* =========================================================
   20 SKILLS
========================================================= */

const SKILLS=[
{name:"Fireball",icon:"🔥",damage:25,price:40,cooldown:5000,type:"fire"},
{name:"Lightning",icon:"⚡",damage:34,price:70,cooldown:6500,type:"lightning"},
{name:"Ice Lance",icon:"❄️",damage:40,price:100,cooldown:7200,type:"ice"},
{name:"Wind Blade",icon:"🌪️",damage:28,price:80,cooldown:5800,type:"wind"},
{name:"Earth Spike",icon:"🪨",damage:47,price:130,cooldown:8500,type:"earth"},
{name:"Water Burst",icon:"💧",damage:32,price:110,cooldown:6200,type:"water"},
{name:"Dark Bolt",icon:"🌑",damage:55,price:170,cooldown:9000,type:"dark"},
{name:"Holy Ray",icon:"✨",damage:60,price:200,cooldown:10000,type:"holy"},
{name:"Poison Nova",icon:"☠️",damage:38,price:140,cooldown:7600,type:"poison"},
{name:"Meteor",icon:"☄️",damage:78,price:300,cooldown:13000,type:"meteor"},
{name:"Thunder Wave",icon:"🌩️",damage:50,price:220,cooldown:9500,type:"thunder"},
{name:"Frost Nova",icon:"🧊",damage:58,price:250,cooldown:10500,type:"frost"},
{name:"Vine Lash",icon:"🌿",damage:42,price:150,cooldown:7000,type:"vine"},
{name:"Arcane Orb",icon:"🔮",damage:65,price:280,cooldown:11000,type:"arcane"},
{name:"Flame Ring",icon:"🔥",damage:63,price:290,cooldown:10500,type:"flame"},
{name:"Soul Drain",icon:"💜",damage:48,price:230,cooldown:8500,type:"soul"},
{name:"Solar Spear",icon:"☀️",damage:72,price:340,cooldown:12000,type:"solar"},
{name:"Moon Beam",icon:"🌙",damage:68,price:320,cooldown:11500,type:"moon"},
{name:"Void Rift",icon:"🌀",damage:84,price:400,cooldown:14500,type:"void"},
{name:"Aruna Burst",icon:"💠",damage:100,price:600,cooldown:17000,type:"aruna"}
];

/* =========================================================
   WEAPONS
========================================================= */

const WEAPON_NAMES=[
"Wood Sword","Iron Sword","Steel Sword","Bronze Axe","War Axe",
"Twin Daggers","Long Bow","Crossbow","Spear","Halberd",
"Mace","Hammer","Katana","Greatsword","Flame Blade",
"Frost Blade","Thunder Staff","Wind Chakram","Shadow Scythe",
"Holy Staff","Crystal Blade","Poison Fang","Meteor Hammer",
"Dragon Slayer","Void Blade","Solar Spear","Moon Staff",
"Aruna Blade","Royal Sword","Legend Blade"
];

const WEAPONS=WEAPON_NAMES.map((name,i)=>({
    name,
    damage:8+i*4,
    price:50+i*75,
    type:i%7
}));

/* =========================================================
   GAME STATE
========================================================= */

let game=null;

function createGame(){
    return{
        running:true,
        map:0,
        gold:150,
        time:0,

        player:{
            x:0,
            y:0,
            hp:100,
            maxHp:100,
            speed:3.8,
            direction:"down",
            moving:false,
            walkTime:0,
            attackCooldown:0,
            invincible:0,
            attackAnim:0
        },

        enemies:[],
        effects:[],
        texts:[],
        particles:[],

        portal:null,
        miniBossDead:false,
        bossDead:false,

        skillSlots:[0,1,2],
        skillCooldown:[0,0,0],

        unlockedSkills:[0],

        weapon:0,
        purchasedWeapons:[0],

        messageTimer:null
    };
}

/* =========================================================
   START / RESTART
========================================================= */

function startGame(){
    initAudio();

    game=createGame();

    document.getElementById("overlay").style.display="none";
    document.getElementById("restart").style.display="none";
    document.getElementById("start").style.display="block";

    document.getElementById("shop").style.display="none";
    document.getElementById("skillBook").style.display="none";

    spawnMap();
    updateUI();

    showMessage("⚔ MAP 1 DIMULAI!");
    sound("magic");
}

document.getElementById("start").addEventListener("click",function(e){
    e.preventDefault();
    e.stopPropagation();
    startGame();
});

document.getElementById("restart").addEventListener("click",function(e){
    e.preventDefault();
    e.stopPropagation();
    startGame();
});

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){
    if(!game) return;

    const el=document.getElementById("message");

    el.textContent=text;
    el.classList.add("show");

    clearTimeout(game.messageTimer);

    game.messageTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}

/* =========================================================
   MAP SPAWN
========================================================= */

function spawnMap(){

    game.enemies=[];
    game.effects=[];
    game.texts=[];
    game.particles=[];

    game.portal=null;
    game.miniBossDead=false;
    game.bossDead=false;

    game.player.x=0;
    game.player.y=0;
    game.player.hp=game.player.maxHp;

    const count=7+(game.map%5);

    for(let i=0;i<count;i++){
        spawnEnemy("normal");
    }

    spawnEnemy("mini");
    spawnEnemy("boss");

    updateUI();
}

/* =========================================================
   ENEMY
========================================================= */

function spawnEnemy(kind){

    const angle=Math.random()*Math.PI*2;
    const radius=300+Math.random()*550;

    const baseHp=35+game.map*12;

    let hp=baseHp;
    let speed=.65+Math.random()*.3;
    let size=1;

    if(kind==="mini"){
        hp=baseHp*4;
        speed=.55;
        size=1.3;
    }

    if(kind==="boss"){
        hp=baseHp*8;
        speed=.4;
        size=1.7;
    }

    game.enemies.push({
        x:Math.cos(angle)*radius,
        y:Math.sin(angle)*radius,
        hp,
        maxHp:hp,
        speed,
        kind,
        size,
        emoji:MAPS[game.map][3],
        name:MAPS[game.map][2],
        attackTimer:0
    });
}

/* =========================================================
   WORLD
========================================================= */

function worldToScreen(wx,wy){
    return{
        x:W/2+(wx-game.player.x),
        y:H/2+(wy-game.player.y)
    };
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    const color=MAPS[game.map][1];

    ctx.fillStyle=color;
    ctx.fillRect(0,0,W,H);

    const grd=ctx.createRadialGradient(
        W/2,H/2,50,
        W/2,H/2,Math.max(W,H)
    );

    grd.addColorStop(0,"rgba(255,255,255,.08)");
    grd.addColorStop(1,"rgba(0,0,0,.25)");

    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);

    /* GRID */

    ctx.globalAlpha=.12;
    ctx.strokeStyle="#fff";
    ctx.lineWidth=1;

    const grid=80;

    const ox=((-game.player.x)%grid+grid)%grid;
    const oy=((-game.player.y)%grid+grid)%grid;

    for(let x=ox;x<W;x+=grid){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=oy;y<H;y+=grid){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.globalAlpha=1;

    /* DECORATIONS */

    for(let i=0;i<55;i++){

        const wx=((i*197+game.map*93)%2200)-1100;
        const wy=((i*137+game.map*51)%1500)-750;

        const p=worldToScreen(wx,wy);

        if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) continue;

        ctx.fillStyle="rgba(255,255,255,.12)";

        ctx.beginPath();
        ctx.arc(p.x,p.y,4+(i%4)*2,0,Math.PI*2);
        ctx.fill();
    }
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const p=worldToScreen(game.player.x,game.player.y);

    const moving=game.player.moving;

    const walk=moving?Math.sin(game.player.walkTime)*6:0;
    const bob=moving?Math.abs(Math.sin(game.player.walkTime))*2:0;

    ctx.save();

    ctx.translate(p.x,p.y-bob);

    /* SHADOW */

    ctx.fillStyle="#0008";
    ctx.beginPath();
    ctx.ellipse(0,30,26,9,0,0,Math.PI*2);
    ctx.fill();

    /* LEGS */

    ctx.strokeStyle="#17243b";
    ctx.lineWidth=9;
    ctx.lineCap="round";

    ctx.beginPath();

    if(moving){
        ctx.moveTo(-8,10);
        ctx.lineTo(-10+walk,30);

        ctx.moveTo(8,10);
        ctx.lineTo(10-walk,30);
