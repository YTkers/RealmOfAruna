<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realm of Aruna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: none;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 9 / 16;
      background: #1a1f2a;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #2d3a4a;
      touch-action: none;
      cursor: crosshair;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 8px; left: 10px; right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      color: #f0e9d0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.3px;
      pointer-events: none;
      z-index: 10;
    }
    #hud span { background: rgba(10,14,23,0.65); padding: 2px 10px; border-radius: 30px; backdrop-filter: blur(2px); border: 1px solid rgba(255,215,120,0.15); }
    #hpBarWrap, #xpBarWrap {
      position: absolute;
      left: 10px; right: 10px;
      height: 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 30px;
      border: 1px solid #665c4a;
      overflow: hidden;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 10;
    }
    #hpBarWrap { top: 42px; }
    #xpBarWrap { top: 58px; }
    #hpBar, #xpBar {
      height: 100%;
      width: 100%;
      border-radius: 30px;
      transition: width 0.1s ease;
    }
    #hpBar { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    #xpBar { background: linear-gradient(90deg, #5b6abf, #8e9df0); }
    #minimap {
      position: absolute;
      top: 10px; right: 10px;
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 2px solid #b89b7a;
      background: rgba(15,20,30,0.8);
      backdrop-filter: blur(3px);
      overflow: hidden;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 0 0 1px #4d3e2b;
    }
    #minimap canvas {
      width: 100%; height: 100%;
      border-radius: 50%;
    }
    #joystick-area {
      position: absolute;
      bottom: 20px; left: 20px;
      width: 120px; height: 120px;
      border-radius: 60px;
      background: rgba(30,40,60,0.4);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255,215,120,0.3);
      pointer-events: auto;
      z-index: 30;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      width: 48px; height: 48px;
      margin-left: -24px; margin-top: -24px;
      border-radius: 30px;
      background: radial-gradient(circle, #f5d79a, #bc8f5a);
      border: 2px solid #ead2a0;
      box-shadow: 0 0 15px rgba(255,200,100,0.3);
      pointer-events: none;
    }
    #menu-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8,10,18,0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
      padding: 20px;
      text-align: center;
      color: #f5e9d8;
    }
    #menu-overlay h1 {
      font-size: 3.2rem;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #f7d875, #c99f4a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(200,150,50,0.3);
      margin-bottom: 8px;
    }
    #menu-overlay p { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; }
    .menu-btn {
      background: #deae5b;
      border: none;
      color: #181c28;
      font-weight: bold;
      font-size: 1.4rem;
      padding: 14px 50px;
      border-radius: 60px;
      margin: 8px 0;
      width: 220px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8f6a34;
      transition: 0.05s linear;
      touch-action: manipulation;
      pointer-events: auto;
      letter-spacing: 1px;
    }
    .menu-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6b4d26; }
    #skill-panel {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      pointer-events: auto;
      padding: 20px;
    }
    #skill-panel h2 { color: #f5d98e; font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 20px #b8860b; }
    .skill-card {
      background: #262d3e;
      border: 2px solid #b6945a;
      border-radius: 30px;
      padding: 16px 24px;
      margin: 8px 0;
      width: 80%;
      max-width: 300px;
      color: #f0e3c6;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #5f4d2c;
      pointer-events: auto;
      touch-action: manipulation;
      background: linear-gradient(145deg, #2d354a, #1c212f);
    }
    .skill-card:active { transform: scale(0.96); }
    .skill-desc { font-size: 0.8rem; opacity: 0.7; font-weight: normal; }
    #gameOver {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5,3,10,0.9);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 60;
      pointer-events: auto;
      color: #f0dcc0;
    }
    #gameOver h1 { font-size: 3.5rem; color: #d94f4f; text-shadow: 0 0 40px #a02020; }
    #gameOver .stat { font-size: 1.1rem; margin: 4px 0; }
    #gameOver .menu-btn { background: #7a5a3a; color: #f0e0c0; box-shadow: 0 6px 0 #4d3822; }
    @media (max-width: 480px) {
      #hud { font-size: 10px; gap: 3px; }
      #hpBarWrap, #xpBarWrap { height: 10px; }
      #joystick-area { width: 100px; height: 100px; bottom: 15px; left: 15px; }
      #joystick-knob { width: 40px; height: 40px; margin-left: -20px; margin-top: -20px; }
      #minimap { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay">
    <div id="hud"><span id="hpText">❤️ 100</span><span id="levelText">Lv.1</span><span id="waveText">🌊 1</span><span id="killText">💀 0</span><span id="timerText">⏱ 0s</span></div>
    <div id="hpBarWrap"><div id="hpBar" style="width:100%"></div></div>
    <div id="xpBarWrap"><div id="xpBar" style="width:0%"></div></div>
    <div id="minimap"><canvas id="minimapCanvas" width="70" height="70"></canvas></div>
    <div id="joystick-area"><div id="joystick-knob"></div></div>
  </div>
  <div id="skill-panel"><h2>⬆ LEVEL UP ⬆</h2><div id="skillOptions"></div></div>
  <div id="gameOver"><h1>💀 YOU DIED</h1><div id="goStats"></div><button class="menu-btn" id="restartBtn">RESTART</button><button class="menu-btn" id="mainMenuBtn">MAIN MENU</button></div>
  <div id="menu-overlay"><h1>REALM of ARUNA</h1><p>survive • upgrade • conquer</p><button class="menu-btn" id="playBtn">▶ PLAY</button><button class="menu-btn" id="upgradeBtn">⬆ UPGRADES</button><button class="menu-btn" id="settingsBtn">⚙ SETTINGS</button></div>
</div>
<script>
// ============================================================
//  REALM OF ARUNA – Complete HTML5 Mobile Roguelike
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');

let W, H;
function resize() {
  const rect = document.getElementById('gameContainer').getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  W = canvas.width; H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ---------- GAME STATE ----------
const G = {
  state: 'menu', // menu | playing | levelup | gameover
  world: 0,
  wave: 1,
  kills: 0,
  time: 0,
  spawnTimer: 0,
  enemies: [],
  bullets: [],
  particles: [],
  xpOrbs: [],
  skills: [],
  // player
  player: null,
  // weapons
  weapon: null,
  // upgrade coins
  coins: 0,
  // persistent upgrades
  perm: { maxHp: 100, damage: 10, fireRate: 1, speed: 2.5, crit: 0.05, xpBonus: 0 },
};

// ---------- UTILITY ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randI(min, max) { return Math.floor(rand(min, max+1)); }
function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a,b,t) { return a + (b-a)*t; }

// ---------- PLAYER ----------
class Player {
  constructor() {
    this.x = W/2; this.y = H/2;
    this.radius = 18;
    this.speed = G.perm.speed || 2.5;
    this.maxHp = G.perm.maxHp || 100;
    this.hp = this.maxHp;
    this.xp = 0;
    this.level = 1;
    this.xpToNext = 20;
    this.dir = 0; // radians
    this.shootCooldown = 0;
    this.alive = true;
    this.hitFlash = 0;
    this.weapon = new Weapon(this);
    this.shieldHP = 0;
    this.drone = null;
    this.vampire = 0;
    this.burnMult = 0;
    this.critMult = 1.5;
    this.bulletCount = 1;
    this.pierce = 0;
    this.explode = 0;
    this.fireRate = G.perm.fireRate || 1;
    this.damage = G.perm.damage || 10;
    this.critChance = G.perm.crit || 0.05;
    this.bulletSpeed = 8;
    this.range = 400;
    this.bulletSize = 4;
  }
  takeDamage(dmg) {
    if (this.shieldHP > 0) {
      const blocked = Math.min(this.shieldHP, dmg);
      this.shieldHP -= blocked;
      dmg -= blocked;
      if (dmg <= 0) return;
    }
    this.hp -= dmg;
    this.hitFlash = 8;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  }
  getLevelXP() { return Math.floor(20 + this.level * 12); }
  addXP(amount) {
    this.xp += amount * (1 + G.perm.xpBonus);
    while (this.xp >= this.getLevelXP()) {
      this.xp -= this.getLevelXP();
      this.level++;
      this.xpToNext = this.getLevelXP();
      showSkillChoices();
    }
  }
  update() {
    if (!this.alive) return;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.shootCooldown > 0) this.shootCooldown -= 1/60;
    // regen
    if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + 0.03);
    // drone update
    if (this.drone) {
      const angle = Math.atan2(this.drone.y - this.y, this.drone.x - this.x);
      const targetDist = 60;
      const dx = this.x + Math.cos(angle)*targetDist - this.drone.x;
      const dy = this.y + Math.sin(angle)*targetDist - this.drone.y;
      this.drone.x += dx * 0.08;
      this.drone.y += dy * 0.08;
      // drone shoot
      if (G.enemies.length > 0 && Math.random() < 0.04) {
        const e = G.enemies.reduce((a,b) => dist(this.drone, a) < dist(this.drone, b) ? a : b);
        if (e && dist(this.drone, e) < 500) {
          const angleTo = Math.atan2(e.y - this.drone.y, e.x - this.drone.x);
          const b = new Bullet(this.drone.x, this.drone.y, angleTo, 7, 8, 0.05, 1, 0, false);
          G.bullets.push(b);
        }
      }
    }
  }
}

// ---------- WEAPON ----------
class Weapon {
  constructor(player) {
    this.player = player;
    this.damage = player.damage;
    this.fireRate = player.fireRate;
    this.bulletSpeed = player.bulletSpeed;
    this.range = player.range;
    this.critChance = player.critChance;
    this.critMult = player.critMult;
    this.bulletSize = player.bulletSize || 4;
    this.bulletCount = player.bulletCount || 1;
    this.pierce = player.pierce || 0;
    this.explode = player.explode || 0;
  }
  shoot(target) {
    if (this.player.shootCooldown > 0) return;
    const p = this.player;
    const angle = Math.atan2(target.y - p.y, target.x - p.x);
    p.dir = angle;
    const count = this.bulletCount;
    for (let i = 0; i < count; i++) {
      let spread = 0;
      if (count > 1) spread = (i / (count-1) - 0.5) * 0.5;
      const a = angle + spread;
      const b = new Bullet(p.x, p.y, a, this.bulletSpeed, this.damage, this.critChance, this.pierce, this.explode, false);
      b.size = this.bulletSize;
      b.range = this.range;
      b.critMult = this.critMult;
      G.bullets.push(b);
    }
    // muzzle particles
    for (let i=0; i<6; i++) {
      const a = angle + rand(-0.4, 0.4);
      const sp = rand(2, 6);
      G.particles.push({x: p.x+Math.cos(angle)*20, y: p.y+Math.sin(angle)*20, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 12, maxLife: 12, color: '#f5d742', size: rand(3,6)});
    }
    this.player.shootCooldown = 1 / (this.fireRate * 1.2);
  }
}

// ---------- BULLET ----------
class Bullet {
  constructor(x, y, angle, speed, damage, crit, pierce, explode, isEnemy) {
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.angle = angle;
    this.damage = damage;
    this.crit = crit || 0;
    this.pierce = pierce || 0;
    this.explode = explode || 0;
    this.isEnemy = isEnemy || false;
    this.size = 4;
    this.range = 400;
    this.critMult = 1.5;
    this.alive = true;
    this.traveled = 0;
    this.hit = [];
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.traveled += Math.hypot(this.vx, this.vy);
    if (this.traveled > this.range) this.alive = false;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.alive = false;
  }
}

// ---------- ENEMY / BOSS ----------
class Enemy {
  constructor(x, y, type, isBoss=false) {
    this.x = x; this.y = y;
    this.isBoss = isBoss;
    this.type = type;
    this.alive = true;
    this.hitFlash = 0;
    const base = G.wave;
    const scale = 1 + (base-1) * 0.12;
    if (isBoss) {
      this.radius = 40;
      this.hp = 120 * scale * 3;
      this.maxHp = this.hp;
      this.damage = 18 * scale;
      this.speed = 1.2 * Math.min(scale, 2);
      this.xpReward = 60 * scale;
      this.color = '#b02f2f';
      this.name = ['Goblin King','Dark Knight','Demon Lord','Ancient Dragon'][G.world % 4] || 'Boss';
    } else {
      const types = [
        {name:'Slime', hp:20, dmg:6, speed:0.9, radius:16, color:'#5f9b6f', xp:8},
        {name:'Goblin', hp:30, dmg:8, speed:1.6, radius:14, color:'#7d8a3a', xp:10},
        {name:'Zombie', hp:40, dmg:10, speed:1.2, radius:18, color:'#4f6d5a', xp:12},
        {name:'Wolf', hp:25, dmg:12, speed:2.4, radius:14, color:'#8b7a6a', xp:11},
        {name:'Skeleton', hp:35, dmg:11, speed:1.8, radius:16, color:'#b0b0b0', xp:13},
        {name:'Orc', hp:55, dmg:14, speed:1.4, radius:22, color:'#5d7a4a', xp:16},
      ];
      const t = types.find(t => t.name === type) || types[0];
      this.radius = t.radius * (0.9 + Math.random()*0.2);
      this.hp = t.hp * scale * (0.8 + Math.random()*0.4);
      this.maxHp = this.hp;
      this.damage = t.dmg * scale * (0.8 + Math.random()*0.3);
      this.speed = t.speed * (0.8 + Math.random()*0.3) * Math.min(scale, 1.6);
      this.xpReward = t.xp * scale * (0.7 + Math.random()*0.5);
      this.color = t.color;
      this.name = t.name;
    }
    this.attackCooldown = 0;
    this.deathTimer = 0;
  }
  takeDamage(dmg, crit=false) {
    this.hp -= dmg;
    this.hitFlash = 8;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    return crit;
  }
  update() {
    if (!this.alive) return;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.attackCooldown > 0) this.attackCooldown -= 1/60;
    // chase player
    const p = G.player;
    if (!p || !p.alive) return;
    const angle = Math.atan2(p.y - this.y, p.x - this.x);
    const d = dist(this, p);
    if (d > 20) {
      this.x += Math.cos(angle) * this.speed * 0.8;
      this.y += Math.sin(angle) * this.speed * 0.8;
    }
    if (d < this.radius + p.radius && this.attackCooldown <= 0) {
      p.takeDamage(this.damage * 0.5);
      this.attackCooldown = 1.0;
    }
    // push out of walls
    this.x = clamp(this.x, 20, W-20);
    this.y = clamp(this.y, 20, H-20);
  }
}

// ---------- SPAWNING ----------
function spawnEnemy() {
  if (!G.player) return;
  const p = G.player;
  const angle = rand(0, Math.PI*2);
  const dist = rand(200, 450);
  const x = clamp(p.x + Math.cos(angle)*dist, 30, W-30);
  const y = clamp(p.y + Math.sin(angle)*dist, 30, H-30);
  const types = ['Slime','Goblin','Zombie','Wolf','Skeleton','Orc'];
  const type = types[randI(0, types.length-1)];
  const e = new Enemy(x, y, type, false);
  G.enemies.push(e);
}

function spawnBoss() {
  if (!G.player) return;
  const p = G.player;
  const angle = rand(0, Math.PI*2);
  const dist = 250;
  const x = clamp(p.x + Math.cos(angle)*dist, 50, W-50);
  const y = clamp(p.y + Math.sin(angle)*dist, 50, H-50);
  const boss = new Enemy(x, y, 'Boss', true);
  // scale boss to wave
  const sc = 1 + (G.wave-1)*0.1;
  boss.hp *= sc;
  boss.maxHp = boss.hp;
  boss.damage *= sc;
  boss.speed *= Math.min(sc, 1.8);
  boss.xpReward *= sc;
  G.enemies.push(boss);
  // boss spawn effect
  for (let i=0; i<30; i++) {
    const a = rand(0, Math.PI*2);
    const sp = rand(2, 8);
    G.particles.push({x: boss.x, y: boss.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 30, maxLife: 30, color: '#ff6644', size: rand(4,10)});
  }
}

// ---------- SKILLS ----------
const skillDefs = [
  { id: 'double', name: 'Double Shot', desc: 'Shoot 2 bullets', apply: () => { G.player.bulletCount = 2; } },
  { id: 'triple', name: 'Triple Shot', desc: 'Shoot 3 spread', apply: () => { G.player.bulletCount = 3; } },
  { id: 'pierce', name: 'Piercing Bullet', desc: '+1 pierce', apply: () => { G.player.pierce += 1; } },
  { id: 'explode', name: 'Explosive Bullet', desc: 'Small explosion', apply: () => { G.player.explode += 0.3; } },
  { id: 'fire', name: 'Fire Bullet', desc: 'Burn enemies', apply: () => { G.player.burnMult += 0.2; } },
  { id: 'critMaster', name: 'Critical Mastery', desc: '+8% crit', apply: () => { G.player.critChance += 0.08; } },
  { id: 'rapid', name: 'Rapid Fire', desc: '+25% fire rate', apply: () => { G.player.fireRate *= 1.25; } },
  { id: 'vampire', name: 'Vampire', desc: 'Heal on kill', apply: () => { G.player.vampire += 3; } },
  { id: 'shield', name: 'Shield', desc: '+20 shield HP', apply: () => { G.player.shieldHP += 20; } },
  { id: 'drone', name: 'Drone', desc: 'Auto-shoot drone', apply: () => { if (!G.player.drone) G.player.drone = {x: G.player.x+40, y: G.player.y}; } },
];
function showSkillChoices() {
  if (G.state === 'gameover' || G.state === 'menu') return;
  G.state = 'levelup';
  const panel = document.getElementById('skill-panel');
  panel.style.display = 'flex';
  const container = document.getElementById('skillOptions');
  container.innerHTML = '';
  const shuffled = [...skillDefs].sort(() => Math.random() - 0.5);
  const chosen = shuffled.slice(0, 3);
  chosen.forEach(skill => {
    const div = document.createElement('div');
    div.className = 'skill-card';
    div.innerHTML = `<div>${skill.name}</div><div class="skill-desc">${skill.desc}</div>`;
    div.addEventListener('click', () => {
      skill.apply();
      panel.style.display = 'none';
      G.state = 'playing';
      // level up particles
      for (let i=0; i<25; i++) {
        const a = rand(0, Math.PI*2);
        const sp = rand(2, 10);
        G.particles.push({x: G.playe
