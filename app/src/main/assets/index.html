<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Realm of Aruna</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b12;
  color:#fff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  display:block;
}

button{
  border:1px solid #71809c;
  background:#26334c;
  color:white;
  padding:10px 14px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
  background:#3d5276;
}

/* ================= START SCREEN ================= */

#startScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#2b3d58 0%,#101722 45%,#05070b 100%);
}

.startBox{
  width:min(460px,92vw);
  padding:25px;
  text-align:center;
  border:2px solid #687893;
  border-radius:15px;
  background:rgba(8,12,20,.94);
  box-shadow:0 0 50px #000;
}

.logo{
  font-size:42px;
  font-weight:900;
  color:#e8c86a;
  text-shadow:
    0 3px #3b2d0d,
    0 0 20px rgba(232,200,106,.25);
}

.subtitle{
  color:#aeb9cb;
  margin:8px 0 20px;
  font-size:14px;
}

.classTitle{
  font-weight:bold;
  margin-bottom:8px;
  color:#e3e9f2;
}

.classGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.classChoice{
  min-height:65px;
  font-size:15px;
}

.classChoice.selected{
  border:2px solid #f0c95b;
  background:#3d4b67;
  box-shadow:0 0 15px rgba(240,201,91,.25);
}

.classDesc{
  font-size:10px;
  display:block;
  margin-top:4px;
  color:#aeb8ca;
}

#startButton{
  width:100%;
  margin-top:15px;
  padding:13px;
  font-size:17px;
  background:#8a6723;
  border-color:#e4bd56;
}

#loadButton{
  width:100%;
  margin-top:7px;
}

#startMessage{
  min-height:18px;
  margin-top:10px;
  color:#e5bd58;
  font-size:12px;
}

/* ================= GAME UI ================= */

#gameUI{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  display:none;
}

.panel{
  position:absolute;
  background:rgba(9,13,22,.88);
  border:1px solid #58647c;
  border-radius:9px;
  box-shadow:0 4px 18px rgba(0,0,0,.5);
  padding:8px;
}

/* player info */

#playerPanel{
  top:8px;
  left:8px;
  width:255px;
}

.playerName{
  font-size:14px;
  font-weight:bold;
  color:#f2d46d;
}

#stats{
  font-size:11px;
  color:#c3cbd8;
  margin:3px 0;
}

.bar{
  width:100%;
  height:12px;
  background:#181b22;
  border:1px solid #555;
  border-radius:7px;
  overflow:hidden;
  margin:3px 0;
}

.fill{
  width:0%;
  height:100%;
}

#hpBar{
  background:#d83c43;
}

#mpBar{
  background:#397de2;
}

#xpBar{
  background:#d5a52e;
}

#gold{
  font-size:11px;
  color:#e7ca70;
}

/* minimap */

#miniMapBox{
  top:8px;
  right:8px;
  width:175px;
  height:175px;
  padding:4px;
}

#miniMap{
  width:100%;
  height:100%;
  border-radius:6px;
  background:#17231b;
}

/* quest */

#questBox{
  top:192px;
  right:8px;
  width:210px;
  font-size:11px;
}

.questTitle{
  color:#e9c75c;
  font-weight:bold;
  margin-bottom:4px;
}

#questText{
  line-height:1.4;
}

/* area */

#areaName{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:bold;
  text-shadow:2px 2px #000;
  opacity:0;
  transition:opacity .3s;
}

/* messages */

#messages{
  position:absolute;
  left:50%;
  bottom:150px;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  font-size:13px;
  text-shadow:2px 2px #000;
}

.message{
  margin:3px;
}

/* skills */

#skillBar{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  pointer-events:auto;
}

.skillButton{
  width:54px;
  height:54px;
  padding:2px;
  font-size:9px;
  background:rgba(14,19,30,.94);
}

.skillNumber{
  display:block;
  font-size:18px;
  color:#f0cf63;
}

.skillName{
  display:block;
  font-size:8px;
}

/* joystick */

#joystick{
  position:absolute;
  left:15px;
  bottom:18px;
  width:125px;
  height:125px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  pointer-events:auto;
}

#joystickKnob{
  position:absolute;
  width:55px;
  height:55px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.25);
}

/* action buttons */

#actionButtons{
  position:absolute;
  right:12px;
  bottom:18px;
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.actionButton{
  width:58px;
  height:58px;
  border-radius:50%;
  padding:0;
  font-size:21px;
  background:rgba(25,31,45,.94);
}

/* menu */

#menu{
  position:absolute;
  z-index:50;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(420px,92vw);
  max-height:80vh;
  overflow:auto;
  pointer-events:auto;
  display:none;
}

#menu h2{
  margin:3px 0 12px;
  color:#e6c35d;
}

#menuContent{
  margin-bottom:8px;
}

.menuItem{
  padding:7px;
  border-bottom:1px solid #3a4252;
  font-size:13px;
}

.menuButton{
  margin:2px;
}

/* mobile hint */

#hint{
  position:absolute;
  left:50%;
  bottom:1px;
  transform:translateX(-50%);
  font-size:9px;
  color:#8792a5;
}

/* death */

#deathScreen{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(40,0,0,.75);
}

.deathBox{
  text-align:center;
  background:#111722;
  border:2px solid #9b4444;
  border-radius:12px;
  padding:25px;
}

/* desktop hide joystick */

@media(min-width:800px){
  #joystick{
    opacity:.15;
  }

  #actionButtons{
    opacity:.8;
  }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- ================= START SCREEN ================= -->

<div id="startScreen">

  <div class="startBox">

    <div class="logo">REALM OF ARUNA</div>

    <div class="subtitle">
      Explore • Fight • Loot • Survive
    </div>

    <div class="classTitle">
      Choose Your Class
    </div>

    <div class="classGrid">

      <button class="classChoice selected" data-class="Warrior">
        ⚔ Warrior
        <span class="classDesc">
          High HP & Defense
        </span>
      </button>

      <button class="classChoice" data-class="Mage">
        🔮 Mage
        <span class="classDesc">
          Powerful Magic
        </span>
      </button>

      <button class="classChoice" data-class="Assassin">
        🗡 Assassin
        <span class="classDesc">
          Fast & Critical
        </span>
      </button>

      <button class="classChoice" data-class="Archer">
        🏹 Archer
        <span class="classDesc">
          Ranged Damage
        </span>
      </button>

    </div>

    <button id="startButton">
      START GAME
    </button>

    <button id="loadButton">
      LOAD SAVED GAME
    </button>

    <div id="startMessage"></div>

  </div>

</div>

<!-- ================= GAME UI ================= -->

<div id="gameUI">

  <div id="playerPanel" class="panel">

    <div class="playerName">
      Toufiqul
    </div>

    <div id="stats">
      Level 1 Warrior
    </div>

    <div class="bar">
      <div id="hpBar" class="fill"></div>
    </div>

    <div class="bar">
      <div id="mpBar" class="fill"></div>
    </div>

    <div class="bar">
      <div id="xpBar" class="fill"></div>
    </div>

    <div id="gold">
      Gold: 0
    </div>

  </div>

  <div id="miniMapBox" class="panel">
    <canvas id="miniMap"></canvas>
  </div>

  <div id="questBox" class="panel">

    <div class="questTitle">
      QUEST
    </div>

    <div id="questText">
      Defeat monsters.
    </div>

  </div>

  <div id="areaName"></div>

  <div id="messages"></div>

  <!-- skills -->

  <div id="skillBar">

    <button class="skillButton" data-skill="1">
      <span class="skillNumber">1</span>
      <span class="skillName">Skill</span>
    </button>

    <button class="skillButton" data-skill="2">
      <span class="skillNumber">2</span>
      <span class="skillName">Skill</span>
    </button>

    <button class="skillButton" data-skill="3">
      <span class="skillNumber">3</span>
      <span class="skillName">Skill</span>
    </button>

    <button class="skillButton" data-skill="4">
      <span class="skillNumber">4</span>
      <span class="skillName">Skill</span>
    </button>

  </div>

  <!-- joystick -->

  <div id="joystick">
    <div id="joystickKnob"></div>
  </div>

  <!-- actions -->

  <div id="actionButtons">

    <button class="actionButton" id="attackButton">
      ⚔
    </button>

    <button class="actionButton" id="potionButton">
      🧪
    </button>

    <button class="actionButton" id="menuButton">
      ☰
    </button>

  </div>

  <div id="hint">
    WASD • SPACE • 1-4 • E • I
  </div>

  <!-- menu -->

  <div id="menu" class="panel">

    <h2>REALM OF ARUNA</h2>

    <div id="menuContent"></div>

    <button class="menuButton" id="characterButton">
      Character
    </button>

    <button class="menuButton" id="inventoryButton">
      Inventory
    </button>

    <button class="menuButton" id="questButton">
      Quest
    </button>

    <button class="menuButton" id="saveButton">
      Save
    </button>

    <button class="menuButton" id="closeMenuButton">
      Close
    </button>

  </div>

</div>

<!-- ================= DEATH ================= -->

<div id="deathScreen">

  <div class="deathBox">

    <h2>You Died</h2>

    <p>
      The world of Aruna has defeated you.
    </p>

    <button id="respawnButton">
      Respawn
    </button>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const miniMap = document.getElementById("miniMap");
const mctx = miniMap.getContext("2d");

let W = 0;
let H = 0;

function resizeCanvas(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

  const rect = miniMap.getBoundingClientRect();

  const dpr = Math.max(1,window.devicePixelRatio || 1);

  miniMap.width = Math.max(1,Math.floor(rect.width*dpr));
  miniMap.height = Math.max(1,Math.floor(rect.height*dpr));

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();

/* =========================================================
   WORLD
========================================================= */

const WORLD = {
  width:4800,
  height:3600
};

const areas = [

  {
    name:"Aruna Village",
    x:0,
    y:0,
    w:1200,
    h:900,
    min:1,
    max:5,
    color:"#315d3a"
  },

  {
    name:"Whispering Forest",
    x:1200,
    y:0,
    w:1200,
    h:1200,
    min:5,
    max:15,
    color:"#214b31"
  },

  {
    name:"Crimson Desert",
    x:2400,
    y:0,
    w:1200,
    h:1200,
    min:15,
    max:25,
    color:"#805335"
  },

  {
    name:"Frozen Valley",
    x:3600,
    y:0,
    w:1200,
    h:1200,
    min:25,
    max:40,
    color:"#526f82"
  },

  {
    name:"Shadow Swamp",
    x:0,
    y:1200,
    w:1600,
    h:1200,
    min:40,
    max:55,
    color:"#293d3b"
  },

  {
    name:"Ancient Ruins",
    x:1600,
    y:1200,
    w:1600,
    h:1200,
    min:55,
    max:70,
    color:"#4c4844"
  },

  {
    name:"Dragon Mountain",
    x:3200,
    y:1200,
    w:1600,
    h:1200,
    min:70,
    max:90,
    color:"#522f30"
  },

  {
    name:"Castle Aruna",
    x:0,
    y:2400,
    w:4800,
    h:1200,
    min:90,
    max:100,
    color:"#363945"
  }

];

/* =========================================================
   MONSTERS
========================================================= */

const monsterTypes = [

  {
    name:"Slime",
    color:"#63d36b",
    base:1,
    hp:45,
    atk:7,
    exp:15,
    gold:5
  },

  {
    name:"Wolf",
    color:"#aaaaaa",
    base:5,
    hp:80,
    atk:14,
    exp:30,
    gold:10
  },

  {
    name:"Goblin",
    color:"#76a846",
    base:8,
    hp:110,
    atk:20,
    exp:45,
    gold:15
  },

  {
    name:"Skeleton",
    color:"#dddddd",
    base:15,
    hp:170,
    atk:30,
    exp:70,
    gold:25
  },

  {
    name:"Orc",
    color:"#688c44",
    base:30,
    hp:350,
    atk:50,
    exp:140,
    gold:50
  },

  {
    name:"Dark Witch",
    color:"#9b58c9",
    base:45,
    hp:500,
    atk:75,
    exp:220,
    gold:80
  },

  {
    name:"Undead Knight",
    color:"#758099",
    base:60,
    hp:800,
    atk:100,
    exp:350,
    gold:120
  },

  {
    name:"Dragon",
    color:"#d34d3e",
    base:80,
    hp:1800,
    atk:180,
    exp:1000,
    gold:500
  }

];

/* =========================================================
   CLASS
========================================================= */

const classStats = {

  Warrior:{
    hp:160,
    mp:60,
    atk:18,
    def:10,
    crit:5
  },

  Mage:{
    hp:90,
    mp:150,
    atk:28,
    def:4,
    crit:8
  },

  Assassin:{
    hp:115,
    mp:80,
    atk:32,
    def:6,
    crit:18
  },

  Archer:{
    hp:120,
    mp:90,
    atk:25,
    def:6,
    crit:12
  }

};

const skillData = {

  Warrior:[
    ["Power Strike",15,1.7],
    ["Shield Bash",20,1.5],
    ["Whirlwind",30,1.2],
    ["Earth Break",40,2.5]
  ],

  Mage:[
    ["Fireball",20,2],
    ["Ice Blast",25,2.2],
    ["Lightning",35,3],
    ["Meteor",50,4]
  ],

  Assassin:[
    ["Shadow Dash",15,2],
    ["Backstab",20,2.7],
    ["Poison Strike",25,2.4],
    ["Shadow Clone",40,4]
  ],

  Archer:[
    ["Quick Shot",15,1.5],
    ["Piercing Arrow",20,2],
    ["Multi Shot",30,1.8],
    ["Rain of Arrows",45,3]
  ]

};

/* =========================================================
   PLAYER
========================================================= */

function createPlayer(cls){

  const s = classStats[cls];

  return {

    x:600,
    y:450,

    radius:18,

    class:cls,

    level:1,

    exp:0,

    gold:100,

    hp:s.hp,
    maxHp:s.hp,

    mp:s.mp,
    maxMp:s.mp,

    atk:s.atk,
    def:s.def,

    crit:s.crit,

    evil:0,

    inventory:[
      "Small HP Potion",
      "Small HP Potion",
      "Mana Potion"
    ],

    equipment:{
      weapon:null,
      armor:null
    },

    quest:{
      kills:0,
      active:true
    },

    attackCooldown:0

  };

}

let player = createPlayer("Warrior");

let gameStarted = false;

let selectedClass = "Warrior";

let enemies = [];
let drops = [];
let particles = [];

let camera = {
  x:0,
  y:0
};

let keys = {};

let joystickX = 0;
let joystickY = 0;

let currentArea = "";

let bossSpawned = {};

let lastTime = 0;

/* =========================================================
   START SCREEN
========================================================= */

const classButtons =
  document.querySelectorAll(".classChoice");

classButtons.forEach(button=>{

  button.addEventListener("click",function(){

    selectedClass = this.dataset.class;

    classButtons.forEach(b=>{
      b.classList.remove("selected");
    });

    this.classList.add("selected");

    document.getElementById("startMessage").textContent =
      selectedClass+" selected.";

  });

});

document
  .getElementById("startButton")
  .addEventListener("click",function(){

    startNewGame(selectedClass);

  });

document
  .getElementById("loadButton")
  .addEventListener("click",function(){

    loadGame();

  });

function startNewGame(cls){

  player = createPlayer(cls);

  enemies = [];
  drops = [];
  particles = [];

  bossSpawned = {};

  currentArea = "";

  gameStarted = true;

  document
    .getElementById("startScreen")
    .style.display = "none";

  document
    .getElementById("gameUI")
    .style.display = "block";

  spawnInitialMonsters();

  showMessage("Welcome to Realm of Aruna!");

  showMessage("You are a "+cls+".");

  showArea();

  updateUI();

  saveGameSilent();

}

function loadGame(){

  const saved =
    localStorage.getItem("realmOfArunaSave");

  if(!saved){

    document.getElementById("startMessage").textContent =
      "No saved game found.";

    return;

  }

  try{

    const loaded = JSON.parse(saved);

    if(!loaded || !loaded.class){

      throw new Error("Invalid save");

    }

    player = loaded;

    enemies = [];
    drops = [];
    particles = [];

    bossSpawned = {};

    currentArea = "";

    gameStarted = true;

    document
      .getElementById("startScreen")
      .style.display = "none";

    document
      .getElementById("gameUI")
      .style.display = "block";

    spawnInitialMonsters();

    showMessage("Saved game loaded.");

    updateUI();

  }catch(error){

    document.getElementById("startMessage").textContent =
      "Save data is invalid.";

  }

}

/* =========================================================
   SAVE
========================================================= */

function saveGameSilent(){

  if(!gameStarted)return;

  localStorage.setItem(
    "realmOfArunaSave",
    JSON.stringify(player)
  );

}

function saveGame(){

  saveGameSilent();

  showMessage("Game saved.");

}

/* =========================================================
   AREA
========================================================= */

function getAreaAt(x,y){

  for(const area of areas){

    if(
      x>=area.x &&
      x<area.x+area.w &&
      y>=area.y &&
      y<area.y+area.h
    ){

      return area;

    }

  }

  return areas[0];

}

function getCurrentArea(){

  return getAreaAt(player.x,player.y);

}

function showArea(){

  const area = getCurrentArea();

  if(area.name === currentArea)return;

  currentArea = area.name;

  const areaElement =
    document.getElementById("areaName");

  areaElement.textContent =
    area.name+
    "  •  Lv."+area.min+"-"+area.max;

  areaElement.style.opacity = "1";

  setTimeout(()=>{

    areaElement.style.opacity = "0";

  },2500);

  if(area.min>=15){

    spawnBoss(area);

  }

}

/* =========================================================
   MONSTER SPAWN
========================================================= */

function getMonsterForArea(area){

  let possible =
    monsterTypes.filter(monster=>
      monster.base <= area.max+5 &&
      monster.base >= Math.max(1,area.min-8)
    );

  if(possible.length===0){

    possible = [monsterTypes[0]];

  }

  return possible[
    Math.floor(Math.random()*possible.length)
  ];

}

function spawnMonster(){

  const area =
    areas[Math.floor(Math.random()*areas.length)];

  const type =
    getMonsterForArea(area);

  const level =
    Math.max(
      1,
      Math.floor(
        area.min+
        Math.random()*
        (area.max-area.min+1)
      )
    );

  const scale =
    1+(level-1)*0.11;

  enemies.push({

    x:
      area.x+
      80+
      Math.random()*
      Math.max(100,area.w-160),

    y:
      area.y+
      80+
      Math.random()*
      Math.max(100,area.h-160),

    radius:
      type.name==="Dragon"?35:15,

    name:type.name,

    color:type.color,

    level:level,

    hp:Math.floor(type.hp*scale),

    maxHp:Math.floor(type.hp*scale),

    atk:Math.floor(type.atk*scale),

    exp:Math.floor(type.exp*scale),

    gold:Math.floor(
      type.gold*
      (0.7+Math.random()*0.8)
    ),

    aggro:false,

    boss:false

  });

}

function spawnInitialMonsters(){

  for(let i=0;i<30;i++){

    spawnMonster();

  }

}

/* =========================================================
   BOSS
========================================================= */

function spawnBoss(area){
