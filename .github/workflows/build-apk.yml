name: Build RealmOfAruna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project structure
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find app/src/main -type f -print

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "===== APK ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK TIDAK DITEMUKAN"
            exit 1
          fi

          cp "$APK" RealmOfAruna.apk

          echo "APK berhasil dibuat:"
          ls -lh RealmOfAruna.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmOfAruna-apk
          path: RealmOfAruna.apk
          if-no-files-found: error
